<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Puppet Rigging & Tracking System - v2.0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #08080c;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam, #output_canvas, #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
    #webcam, #bg-video {
      display: none;
    }
    #output_canvas {
      z-index: 2;
      transform: scaleX(-1);
    }

    /* Panou Control Control */
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 340px;
      max-height: 92vh;
      overflow-y: auto;
      background: rgba(15, 15, 25, 0.92);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .btn-main {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      border: none;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-main:hover {
      transform: scale(1.02);
    }

    .btn-toggle {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-toggle.active {
      background: rgba(0, 255, 204, 0.3);
      border-color: #00ffcc;
      color: #00ffcc;
    }

    .upload-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }
    .upload-group label {
      color: #00ffcc;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .file-input {
      color: #ccc;
      font-size: 12px;
    }

    .row-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .scale-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 12px;
    }
    .scale-controls input[type="range"] {
      flex: 1;
    }

    #status {
      color: #00ffcc;
      font-size: 12px;
      font-weight: bold;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="container">
  <div id="ui-overlay">
    <button id="start-btn" class="btn-main">▶️ Pornire Puppet Rig v2.0</button>
    <div id="status">Apasă pe buton pentru start...</div>

    <!-- Switchuri ON/OFF Layer-e -->
    <div class="upload-group">
      <label>Comutatoare Layer-e (ON / OFF)</label>
      <div class="row-btns">
        <button id="toggle-png" class="btn-toggle active">PNG Puppet: ON</button>
        <button id="toggle-skeleton" class="btn-toggle active">Linii Tracking: ON</button>
        <button id="toggle-crop" class="btn-toggle active">Crop AI: ON</button>
      </div>
    </div>

    <!-- Upload Fragmente PNG -->
    <div class="upload-group">
      <label>Încărcare Fragmente PNG 2D</label>
      
      <div class="scale-controls">
        <span>1. Cap / Față:</span>
        <input type="file" id="png-head" accept="image/png,image/*" class="file-input">
      </div>

      <div class="scale-controls">
        <span>2. Bust / Torso:</span>
        <input type="file" id="png-torso" accept="image/png,image/*" class="file-input">
      </div>

      <div class="scale-controls">
        <span>3. Braț Stâng:</span>
        <input type="file" id="png-arm-left" accept="image/png,image/*" class="file-input">
      </div>

      <div class="scale-controls">
        <span>4. Braț Drept:</span>
        <input type="file" id="png-arm-right" accept="image/png,image/*" class="file-input">
      </div>
    </div>

    <!-- Scalare globală Puppet -->
    <div class="upload-group">
      <label>Setări Scalare Fragmente</label>
      <div class="scale-controls">
        <span>Scală Cap:</span>
        <input type="range" id="scale-head" min="0.5" max="3.0" step="0.1" value="1.0">
      </div>
      <div class="scale-controls">
        <span>Scală Torso:</span>
        <input type="range" id="scale-torso" min="0.5" max="3.0" step="0.1" value="1.0">
      </div>
      <div class="scale-controls">
        <span>Grosime Brațe:</span>
        <input type="range" id="scale-arms" min="0.5" max="3.0" step="0.1" value="1.0">
      </div>
    </div>

    <!-- Fundal -->
    <div class="upload-group">
      <label>Fundal Custom</label>
      <input type="file" id="bg-file-upload" accept="image/*,video/*" class="file-input">
    </div>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <video id="bg-video" autoplay loop muted playsinline></video>
  <canvas id="output_canvas"></canvas>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const bgVideoElement = document.getElementById('bg-video');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');

  const startBtn = document.getElementById('start-btn');
  const statusDiv = document.getElementById('status');

  // Toggle BTNs
  const togglePngBtn = document.getElementById('toggle-png');
  const toggleSkeletonBtn = document.getElementById('toggle-skeleton');
  const toggleCropBtn = document.getElementById('toggle-crop');

  // Inputs Fragmente
  const inputHead = document.getElementById('png-head');
  const inputTorso = document.getElementById('png-torso');
  const inputArmLeft = document.getElementById('png-arm-left');
  const inputArmRight = document.getElementById('png-arm-right');
  const bgFileUpload = document.getElementById('bg-file-upload');

  // Sliders
  const sliderHead = document.getElementById('scale-head');
  const sliderTorso = document.getElementById('scale-torso');
  const sliderArms = document.getElementById('scale-arms');

  // Stări Aplicație
  let showPng = true;
  let showSkeleton = true;
  let enableCrop = true;

  let bgType = 'none';
  let customBgImg = null;

  // Stocare Imagini Fragmente PNG
  const puppetImages = {
    head: null,
    torso: null,
    armLeft: null,
    armRight: null
  };

  const puppetScales = {
    head: 1.0,
    torso: 1.0,
    arms: 1.0
  };

  const maskCanvas = document.createElement('canvas');
  const maskCtx = maskCanvas.getContext('2d');

  function resizeCanvas() {
    canvasElement.width = window.innerWidth;
    canvasElement.height = window.innerHeight;
    maskCanvas.width = window.innerWidth;
    maskCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Helper Salvare/Încărcare LocalStorage pentru fișiere (IndexedDB / Base64)
  function saveImageToStorage(key, imgDataUrl) {
    try { localStorage.setItem(key, imgDataUrl); } catch(e){}
  }

  function loadImage(src, callback) {
    if(!src) return;
    const img = new Image();
    img.onload = () => callback(img);
    img.src = src;
  }

  // Deschidere și Salvare Fragmente
  function handleFileInput(inputEl, storageKey, objKey) {
    inputEl.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const dataUrl = event.target.result;
          loadImage(dataUrl, (img) => { puppetImages[objKey] = img; });
          saveImageToStorage(storageKey, dataUrl);
          statusDiv.innerText = `Fragment ${objKey} încărcat!`;
        };
        reader.readAsDataURL(file);
      }
    });
  }

  handleFileInput(inputHead, 'app_png_head', 'head');
  handleFileInput(inputTorso, 'app_png_torso', 'torso');
  handleFileInput(inputArmLeft, 'app_png_arm_left', 'armLeft');
  handleFileInput(inputArmRight, 'app_png_arm_right', 'armRight');

  // Restaurare automata la reîncărcare pagină
  window.addEventListener('load', () => {
    ['head', 'torso', 'arm_left', 'arm_right'].forEach(part => {
      const saved = localStorage.getItem(`app_png_${part}`);
      const keyMap = { head: 'head', torso: 'torso', arm_left: 'armLeft', arm_right: 'armRight' };
      if (saved) loadImage(saved, (img) => { puppetImages[keyMap[part]] = img; });
    });
  });

  // Event-uri Toggles
  togglePngBtn.addEventListener('click', () => {
    showPng = !showPng;
    togglePngBtn.classList.toggle('active', showPng);
    togglePngBtn.innerText = `PNG Puppet: ${showPng ? 'ON' : 'OFF'}`;
  });

  toggleSkeletonBtn.addEventListener('click', () => {
    showSkeleton = !showSkeleton;
    toggleSkeletonBtn.classList.toggle('active', showSkeleton);
    toggleSkeletonBtn.innerText = `Linii Tracking: ${showSkeleton ? 'ON' : 'OFF'}`;
  });

  toggleCropBtn.addEventListener('click', () => {
    enableCrop = !enableCrop;
    toggleCropBtn.classList.toggle('active', enableCrop);
    toggleCropBtn.innerText = `Crop AI: ${enableCrop ? 'ON' : 'OFF'}`;
  });

  sliderHead.addEventListener('input', (e) => puppetScales.head = parseFloat(e.target.value));
  sliderTorso.addEventListener('input', (e) => puppetScales.torso = parseFloat(e.target.value));
  sliderArms.addEventListener('input', (e) => puppetScales.arms = parseFloat(e.target.value));

  // Fundal
  bgFileUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.type.startsWith('image/')) {
      bgType = 'image';
      bgVideoElement.pause();
      loadImage(URL.createObjectURL(file), (img) => customBgImg = img);
    } else if (file.type.startsWith('video/')) {
      bgType = 'video';
      bgVideoElement.src = URL.createObjectURL(file);
      bgVideoElement.play();
    }
  });

  // Funcție Matematică pentru Desenare și Rotație Segment 2D
  function drawBoneSegment(ctx, img, p1, p2, scaleFactor = 1.0, widthOverride = null) {
    if (!img) return;

    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const distance = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx);

    ctx.save();
    ctx.translate(p1.x, p1.y);
    ctx.rotate(angle);

    const drawLength = distance;
    const drawWidth = (widthOverride || (img.height * (drawLength / img.width))) * scaleFactor;

    // Desenează segmentul orientat după axa dintre cele două articulații
    ctx.drawImage(img, 0, -drawWidth / 2, drawLength, drawWidth);
    ctx.restore();
  }

  // MediaPipe Setup
  const holistic = new Holistic({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
  });

  holistic.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: true,
    smoothSegmentation: true,
    refineFaceLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  holistic.onResults((results) => {
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);

    // 1. FUNDAL & CROP AI
    if (enableCrop && results.segmentationMask) {
      maskCtx.save();
      maskCtx.clearRect(0, 0, w, h);
      maskCtx.drawImage(results.segmentationMask, 0, 0, w, h);
      maskCtx.globalCompositeOperation = 'source-in';
      maskCtx.drawImage(results.image, 0, 0, w, h);
      maskCtx.restore();

      if (bgType === 'image' && customBgImg) {
        canvasCtx.drawImage(customBgImg, 0, 0, w, h);
      } else if (bgType === 'video' && bgVideoElement.readyState >= 2) {
        canvasCtx.drawImage(bgVideoElement, 0, 0, w, h);
      } else {
        canvasCtx.fillStyle = '#0a0a10';
        canvasCtx.fillRect(0, 0, w, h);
      }

      canvasCtx.drawImage(maskCanvas, 0, 0, w, h);
    } else {
      canvasCtx.drawImage(results.image, 0, 0, w, h);
    }

    // 2. PUPPET RIGGING 2D & SKELETON
    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const pts = {
        nose:          { x: lm[0].x * w,  y: lm[0].y * h },
        leftShoulder:  { x: lm[11].x * w, y: lm[11].y * h },
        rightShoulder: { x: lm[12].x * w, y: lm[12].y * h },
        leftElbow:     { x: lm[13].x * w, y: lm[13].y * h },
        rightElbow:    { x: lm[14].x * w, y: lm[14].y * h },
        leftWrist:     { x: lm[15].x * w, y: lm[15].y * h },
        rightWrist:    { x: lm[16].x * w, y: lm[16].y * h },
        leftHip:       { x: lm[23].x * w, y: lm[23].y * h },
        rightHip:      { x: lm[24].x * w, y: lm[24].y * h }
      };

      const shoulderWidth = Math.hypot(pts.rightShoulder.x - pts.leftShoulder.x, pts.rightShoulder.y - pts.leftShoulder.y);

      // --- LAYER PNG PUPPET (ROTAȚIE PE ARTICULAȚII) ---
      if (showPng) {
        // A. Torso / Bust (Ancorat între umeri și șolduri)
        if (puppetImages.torso) {
          const chestCenter = { x: (pts.leftShoulder.x + pts.rightShoulder.x)/2, y: (pts.leftShoulder.y + pts.leftHip.y)/2 };
          const torsoW = shoulderWidth * 1.6 * puppetScales.torso;
          const torsoH = (puppetImages.torso.height / puppetImages.torso.width) * torsoW;
          canvasCtx.drawImage(puppetImages.torso, chestCenter.x - torsoW/2, chestCenter.y - torsoH/2, torsoW, torsoH);
        }

        // B. Cap (Orientat pe nas)
        if (puppetImages.head) {
          const headW = shoulderWidth * 1.2 * puppetScales.head;
          const headH = (puppetImages.head.height / puppetImages.head.width) * headW;
          canvasCtx.drawImage(puppetImages.head, pts.nose.x - headW/2, pts.nose.y - headH/2, headW, headH);
        }

        // C. Braț Stâng (Segmentat Umăr -> Cot -> Încheietură)
        drawBoneSegment(canvasCtx, puppetImages.armLeft, pts.leftShoulder, pts.leftElbow, puppetScales.arms);

        // D. Braț Drept
        drawBoneSegment(canvasCtx, puppetImages.armRight, pts.rightShoulder, pts.rightElbow, puppetScales.arms);
      }

      // --- LAYER LINII DE TRACKING ---
      if (showSkeleton) {
        // Poligon Bust
        canvasCtx.beginPath();
        canvasCtx.moveTo(pts.leftShoulder.x, pts.leftShoulder.y);
        canvasCtx.lineTo(pts.rightShoulder.x, pts.rightShoulder.y);
        canvasCtx.lineTo(pts.rightHip.x, pts.rightHip.y);
        canvasCtx.lineTo(pts.leftHip.x, pts.leftHip.y);
        canvasCtx.closePath();
        canvasCtx.fillStyle = 'rgba(0, 255, 204, 0.15)';
        canvasCtx.fill();
        canvasCtx.strokeStyle = '#00ffcc';
        canvasCtx.lineWidth = 2;
        canvasCtx.stroke();

        // Cerc Cap
        canvasCtx.beginPath();
        canvasCtx.arc(pts.nose.x, pts.nose.y, shoulderWidth * 0.35, 0, 2 * Math.PI);
        canvasCtx.strokeStyle = '#00f2fe';
        canvasCtx.lineWidth = 2;
        canvasCtx.stroke();

        // Brațe
        const arms = [
          [pts.leftShoulder, pts.leftElbow], [pts.leftElbow, pts.leftWrist],
          [pts.rightShoulder, pts.rightElbow], [pts.rightElbow, pts.rightWrist]
        ];
        canvasCtx.strokeStyle = '#ff0055';
        canvasCtx.lineWidth = 3;
        arms.forEach(([p1, p2]) => {
          canvasCtx.beginPath();
          canvasCtx.moveTo(p1.x, p1.y);
          canvasCtx.lineTo(p2.x, p2.y);
          canvasCtx.stroke();
        });

        // Articulații
        Object.values(pts).forEach((p) => {
          canvasCtx.beginPath();
          canvasCtx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
          canvasCtx.fillStyle = '#ffff00';
          canvasCtx.fill();
          canvasCtx.stroke();
        });
      }
    }

    // Degete Hands (Dacă este bifat scheletul)
    if (showSkeleton) {
      if (results.leftHandLandmarks) drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 1.5 });
      if (results.rightHandLandmarks) drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 1.5 });
    }

    canvasCtx.restore();
  });

  // Start Camera
  startBtn.addEventListener('click', async () => {
    statusDiv.innerText = "Se pornește sistemul...";
    startBtn.style.display = 'none';
    let camera = new Camera(videoElement, {
      onFrame: async () => { await holistic.send({ image: videoElement }); },
      width: 1280,
      height: 720
    });
    await camera.start();
    statusDiv.innerText = "v2.0 Activ • Pregătit pentru PNG Rigging!";
  });
</script>

</body>
</html>
