<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Versiunea 1.1: Mapare Cap, Bust, Mâini și Crop Fundal AI -->
  <title>Mapare Full Upper Body - v1.1</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0d0d11;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam, #output_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1); /* Oglindire orizontală */
    }
    #webcam {
      display: none; /* Ascundem fluxul video brut */
    }
    #output_canvas {
      z-index: 2;
    }
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-action {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      border: none;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      transform: scale(1.03);
    }
    #status {
      color: #00ffcc;
      background: rgba(0, 0, 0, 0.85);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      border: 1px solid rgba(0, 255, 204, 0.2);
    }
    #version-tag {
      position: absolute;
      bottom: 20px;
      right: 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      z-index: 10;
    }
  </style>

  <!-- Librării MediaPipe Holistic -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="container">
  <div id="ui-overlay">
    <button id="start-btn" class="btn-action">▶️ Pornește Tracking Full Upper Body</button>
    <div id="status">Apasă pe buton pentru inițializare...</div>
  </div>

  <div id="version-tag">Versiunea 1.1</div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="output_canvas"></canvas>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const startBtn = document.getElementById('start-btn');
  const statusDiv = document.getElementById('status');
  const container = document.getElementById('container');

  let camera = null;

  function resizeCanvas() {
    canvasElement.width = window.innerWidth;
    canvasElement.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const holistic = new Holistic({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
  });

  holistic.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: true, // Crop / Decupare fundal AI
    smoothSegmentation: true,
    refineFaceLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  holistic.onResults((results) => {
    statusDiv.innerText = "v1.1 Activ: Cap + Bust + Brațe + Mâini + Decupare AI";

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    const w = canvasElement.width;
    const h = canvasElement.height;

    // 1. DECUPARE FUNDAL (CROP AI)
    if (results.segmentationMask) {
      canvasCtx.drawImage(results.segmentationMask, 0, 0, w, h);
      canvasCtx.globalCompositeOperation = 'source-in';
      canvasCtx.drawImage(results.image, 0, 0, w, h);
      canvasCtx.globalCompositeOperation = 'source-over';
    } else {
      canvasCtx.drawImage(results.image, 0, 0, w, h);
    }

    // 2. SHAPE BUST + CAP + BRAȚE
    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const pts = {
        nose:          { x: lm[0].x * w,  y: lm[0].y * h },
        leftEar:       { x: lm[7].x * w,  y: lm[7].y * h },
        rightEar:      { x: lm[8].x * w,  y: lm[8].y * h },
        leftShoulder:  { x: lm[11].x * w, y: lm[11].y * h },
        rightShoulder: { x: lm[12].x * w, y: lm[12].y * h },
        leftElbow:     { x: lm[13].x * w, y: lm[13].y * h },
        rightElbow:    { x: lm[14].x * w, y: lm[14].y * h },
        leftHip:       { x: lm[23].x * w, y: lm[23].y * h },
        rightHip:      { x: lm[24].x * w, y: lm[24].y * h }
      };

      // Punct de mijloc între umeri (Baza gâtului)
      const neckBase = {
        x: (pts.leftShoulder.x + pts.rightShoulder.x) / 2,
        y: (pts.leftShoulder.y + pts.rightShoulder.y) / 2
      };

      // Forma Bustului (Poligon verde)
      canvasCtx.beginPath();
      canvasCtx.moveTo(pts.leftShoulder.x, pts.leftShoulder.y);
      canvasCtx.lineTo(pts.rightShoulder.x, pts.rightShoulder.y);
      canvasCtx.lineTo(pts.rightHip.x, pts.rightHip.y);
      canvasCtx.lineTo(pts.leftHip.x, pts.leftHip.y);
      canvasCtx.closePath();
      canvasCtx.fillStyle = 'rgba(0, 255, 204, 0.25)';
      canvasCtx.fill();
      canvasCtx.strokeStyle = '#00ffcc';
      canvasCtx.lineWidth = 3;
      canvasCtx.stroke();

      // Linia Gât / Cap (Conectează nasul la baza gâtului)
      canvasCtx.beginPath();
      canvasCtx.moveTo(neckBase.x, neckBase.y);
      canvasCtx.lineTo(pts.nose.x, pts.nose.y);
      canvasCtx.strokeStyle = '#ffff00';
      canvasCtx.lineWidth = 4;
      canvasCtx.stroke();

      // Forma Capului (Contur cap/urechi)
      canvasCtx.beginPath();
      canvasCtx.arc(pts.nose.x, pts.nose.y, Math.abs(pts.leftShoulder.x - pts.rightShoulder.x) * 0.25, 0, 2 * Math.PI);
      canvasCtx.strokeStyle = 'rgba(0, 242, 254, 0.8)';
      canvasCtx.lineWidth = 2;
      canvasCtx.stroke();

      // Conexiuni Brațe
      const arms = [
        [pts.leftShoulder, pts.leftElbow],
        [pts.rightShoulder, pts.rightElbow]
      ];
      canvasCtx.strokeStyle = '#ff0055';
      canvasCtx.lineWidth = 5;
      arms.forEach(([p1, p2]) => {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x, p1.y);
        canvasCtx.lineTo(p2.x, p2.y);
        canvasCtx.stroke();
      });

      // Desenare Puncte Articulații Mari
      [pts.nose, pts.leftShoulder, pts.rightShoulder, pts.leftElbow, pts.rightElbow, pts.leftHip, pts.rightHip].forEach((p) => {
        canvasCtx.beginPath();
        canvasCtx.arc(p.x, p.y, 10, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#ffff00';
        canvasCtx.fill();
        canvasCtx.lineWidth = 2;
        canvasCtx.strokeStyle = '#000';
        canvasCtx.stroke();
      });
    }

    // 3. MÂINI (LEFT & RIGHT HAND TRACKING)
    if (results.leftHandLandmarks) {
      drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 2 });
      drawLandmarks(canvasCtx, results.leftHandLandmarks, { color: '#ff00ff', radius: 3 });
    }
    if (results.rightHandLandmarks) {
      drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 2 });
      drawLandmarks(canvasCtx, results.rightHandLandmarks, { color: '#ff00ff', radius: 3 });
    }

    canvasCtx.restore();
  });

  startBtn.addEventListener('click', async () => {
    if (container.requestFullscreen) {
      container.requestFullscreen();
    }

    statusDiv.innerText = "Pornire modul AI & Camera...";
    startBtn.style.display = 'none';

    if (!camera) {
      camera = new Camera(videoElement, {
        onFrame: async () => {
          await holistic.send({ image: videoElement });
        },
        width: 1280,
        height: 720
      });
      await camera.start();
    }
  });
</script>

</body>
</html>
