<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapare Corp & Bust Pas cu Pas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam, #output_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1); /* Oglindire camera */
    }
    #webcam {
      opacity: 0.3;
      z-index: 1;
    }
    #output_canvas {
      z-index: 2;
    }
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-action {
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
    }
    #status {
      color: #00ffcc;
      background: rgba(0, 0, 0, 0.8);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>

  <!-- Librarii MediaPipe Pose stabilite -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="container">
  <div id="ui-overlay">
    <button id="start-btn" class="btn-action">▶️ Porneste Maparea Corpului</button>
    <div id="status">Apasă pe buton pentru inițializare...</div>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="output_canvas"></canvas>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const startBtn = document.getElementById('start-btn');
  const statusDiv = document.getElementById('status');
  const container = document.getElementById('container');

  let camera = null;

  function resizeCanvas() {
    canvasElement.width = window.innerWidth;
    canvasElement.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Configurare MediaPipe Pose pentru identificarea celor 12+ puncte ale corpului
  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults((results) => {
    statusDiv.innerText = "Tracking Activ: Corp & Bust detectate!";

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;
      const w = canvasElement.width;
      const h = canvasElement.height;

      // Punctele principale ale bustului și corpului (convertite la pixeli reali)
      const points = {
        leftShoulder:  { x: lm[11].x * w, y: lm[11].y * h },
        rightShoulder: { x: lm[12].x * w, y: lm[12].y * h },
        leftElbow:     { x: lm[13].x * w, y: lm[13].y * h },
        rightElbow:    { x: lm[14].x * w, y: lm[14].y * h },
        leftWrist:     { x: lm[15].x * w, y: lm[15].y * h },
        rightWrist:    { x: lm[16].x * w, y: lm[16].y * h },
        leftHip:       { x: lm[23].x * w, y: lm[23].y * h },
        rightHip:      { x: lm[24].x * w, y: lm[24].y * h },
        leftKnee:      { x: lm[25].x * w, y: lm[25].y * h },
        rightKnee:     { x: lm[26].x * w, y: lm[26].y * h },
        leftAnkle:     { x: lm[27].x * w, y: lm[27].y * h },
        rightAnkle:    { x: lm[28].x * w, y: lm[28].y * h }
      };

      // 1. DESENARE SHAPE / FORMA BUSTULUI (Poligon complet între Umeri și Șolduri)
      canvasCtx.beginPath();
      canvasCtx.moveTo(points.leftShoulder.x, points.leftShoulder.y);
      canvasCtx.lineTo(points.rightShoulder.x, points.rightShoulder.y);
      canvasCtx.lineTo(points.rightHip.x, points.rightHip.y);
      canvasCtx.lineTo(points.leftHip.x, points.leftHip.y);
      canvasCtx.closePath();
      canvasCtx.fillStyle = 'rgba(0, 255, 204, 0.25)'; // Umplere bust
      canvasCtx.fill();
      canvasCtx.strokeStyle = '#00ffcc';
      canvasCtx.lineWidth = 4;
      canvasCtx.stroke();

      // 2. DESENARE CONEXIUNI BRAȚE ȘI PICIOARE (Linii groase)
      const connections = [
        [points.leftShoulder, points.leftElbow],
        [points.leftElbow, points.leftWrist],
        [points.rightShoulder, points.rightElbow],
        [points.rightElbow, points.rightWrist],
        [points.leftHip, points.leftKnee],
        [points.leftKnee, points.leftAnkle],
        [points.rightHip, points.rightKnee],
        [points.rightKnee, points.rightAnkle]
      ];

      canvasCtx.strokeStyle = '#ff0055';
      canvasCtx.lineWidth = 6;
      connections.forEach(([p1, p2]) => {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x, p1.y);
        canvasCtx.lineTo(p2.x, p2.y);
        canvasCtx.stroke();
      });

      // 3. DESENARE CELE 12 PUNCTE MARI CHEIE (Articulații)
      Object.values(points).forEach((pt) => {
        canvasCtx.beginPath();
        canvasCtx.arc(pt.x, pt.y, 12, 0, 2 * Math.PI); // Puncte mari (Raza 12px)
        canvasCtx.fillStyle = '#ffff00';
        canvasCtx.fill();
        canvasCtx.lineWidth = 3;
        canvasCtx.strokeStyle = '#000';
        canvasCtx.stroke();
      });
    }

    canvasCtx.restore();
  });

  // Pornire Full Screen + Camera
  startBtn.addEventListener('click', async () => {
    if (container.requestFullscreen) {
      container.requestFullscreen();
    }

    statusDiv.innerText = "Se pornește camera...";
    startBtn.style.display = 'none';

    if (!camera) {
      camera = new Camera(videoElement, {
        onFrame: async () => {
          await pose.send({ image: videoElement });
        },
        width: 1280,
        height: 720
      });
      await camera.start();
    }
  });
</script>

</body>
</html>
