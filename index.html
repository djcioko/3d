<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D & 3D Rigging - Free Warp Mesh Mapping (Torso Modulation)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #08080c;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam, #output_canvas, #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
    #webcam, #bg-video {
      display: none;
    }
    #output_canvas {
      z-index: 2;
      transform: scaleX(-1);
      cursor: crosshair;
    }

    /* Floating Toggle for Controls */
    #ui-toggle-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 100;
      background: rgba(0, 255, 204, 0.2);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #ui-toggle-btn:hover {
      background: rgba(0, 255, 204, 0.4);
    }

    /* UI Overlay */
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 380px;
      max-height: 92vh;
      overflow-y: auto;
      background: rgba(15, 15, 25, 0.92);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #ui-overlay.hidden {
      display: none !important;
    }

    .btn-main {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      border: none;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-main:hover {
      transform: scale(1.02);
    }

    .btn-toggle {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 5px 8px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      min-width: 65px;
      text-align: center;
    }
    .btn-toggle.active {
      background: rgba(0, 255, 204, 0.3);
      border-color: #00ffcc;
      color: #00ffcc;
      font-weight: bold;
    }

    .upload-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }
    .upload-group label {
      color: #00ffcc;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .file-input {
      color: #ccc;
      font-size: 11px;
      flex: 1;
    }

    .row-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scale-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 11px;
    }
    .scale-controls input[type="range"] {
      flex: 1;
    }

    #status {
      color: #00ffcc;
      font-size: 12px;
      font-weight: bold;
    }
  </style>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="container">
  <button id="ui-toggle-btn">👁️ Hide Controls</button>

  <div id="ui-overlay">
    <button id="start-btn" class="btn-main">▶ Pornire Engine Rigging</button>
    <div id="status">Apasă pe buton pentru start...</div>

    <!-- Comutatoare Globale -->
    <div class="upload-group">
      <label>Comutatoare Generale</label>
      <div class="row-btns">
        <button id="toggle-skeleton" class="btn-toggle active">Linii Tracking: ON</button>
        <button id="toggle-crop" class="btn-toggle active">Crop AI: ON</button>
        <button id="toggle-hide-cam" class="btn-toggle">Camera: SHOW</button>
        <button id="reset-offsets" class="btn-toggle" style="border-color:#ff0055; color:#ff3366;">Reset Modulație</button>
      </div>
    </div>

    <!-- Mapare Segmente (Foto / Video) -->
    <div class="upload-group">
      <label>Încărcare Măști & Segmente (Foto / Video)</label>
      
      <!-- CAP -->
      <div class="item-row">
        <button id="tog-head" class="btn-toggle active">Cap: ON</button>
        <input type="file" id="file-head" accept="image/*,video/*" class="file-input">
      </div>

      <!-- TORSO (Modulare Freeform Mesh 4x4 Puncte) -->
      <div class="item-row">
        <button id="tog-torso" class="btn-toggle active">Torso Warp: ON</button>
        <input type="file" id="file-torso" accept="image/*,video/*" class="file-input">
      </div>

      <!-- BRAȚ STÂNG -->
      <div class="item-row">
        <button id="tog-arm-left" class="btn-toggle active">Braț L: ON</button>
        <input type="file" id="file-arm-left" accept="image/*,video/*" class="file-input">
      </div>

      <!-- BRAȚ DREPT -->
      <div class="item-row">
        <button id="tog-arm-right" class="btn-toggle active">Braț R: ON</button>
        <input type="file" id="file-arm-right" accept="image/*,video/*" class="file-input">
      </div>
    </div>

    <!-- Model 3D GLB -->
    <div class="upload-group">
      <label>Model 3D Separabil (GLB / GLTF)</label>
      <div class="item-row">
        <button id="tog-3d" class="btn-toggle active">Model 3D: ON</button>
        <input type="file" id="file-3d" accept=".glb,.gltf" class="file-input">
      </div>
      <div class="scale-controls">
        <span>Scală 3D:</span>
        <input type="range" id="scale-3d" min="0.1" max="3.0" step="0.05" value="1.0">
      </div>
      <div class="scale-controls">
        <span>Offset X 3D:</span>
        <input type="range" id="offset-3d-x" min="-300" max="300" step="2" value="0">
      </div>
      <div class="scale-controls">
        <span>Offset Y 3D:</span>
        <input type="range" id="offset-3d-y" min="-300" max="300" step="2" value="0">
      </div>
    </div>

    <!-- Calibrări & Scalare -->
    <div class="upload-group">
      <label>Scalare Cap & Brațe</label>
      <div class="scale-controls">
        <span>Scală Cap:</span>
        <input type="range" id="scale-head" min="0.3" max="3.0" step="0.05" value="1.0">
      </div>
      <div class="scale-controls">
        <span>Grosime Brațe:</span>
        <input type="range" id="scale-arms" min="0.5" max="3.0" step="0.1" value="1.0">
      </div>
    </div>

    <!-- Fundal Custom -->
    <div class="upload-group">
      <label>Fundal Custom (Foto / Video)</label>
      <input type="file" id="bg-file-upload" accept="image/*,video/*" class="file-input">
    </div>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <video id="bg-video" autoplay loop muted playsinline></video>
  <canvas id="output_canvas"></canvas>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const bgVideoElement = document.getElementById('bg-video');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');

  const startBtn = document.getElementById('start-btn');
  const statusDiv = document.getElementById('status');
  const resetBtn = document.getElementById('reset-offsets');

  // UI Toggle
  const uiOverlay = document.getElementById('ui-overlay');
  const uiToggleBtn = document.getElementById('ui-toggle-btn');
  let isUiVisible = true;

  uiToggleBtn.addEventListener('click', () => {
    isUiVisible = !isUiVisible;
    uiOverlay.classList.toggle('hidden', !isUiVisible);
    uiToggleBtn.innerText = isUiVisible ? "👁️ Hide Controls" : "👁️ Show Controls";
  });

  // Controls Global
  const toggleSkeletonBtn = document.getElementById('toggle-skeleton');
  const toggleCropBtn = document.getElementById('toggle-crop');
  const toggleHideCamBtn = document.getElementById('toggle-hide-cam');
  const tog3DBtn = document.getElementById('tog-3d');

  // Controls Segmente
  const togHeadBtn = document.getElementById('tog-head');
  const togTorsoBtn = document.getElementById('tog-torso');
  const togArmLeftBtn = document.getElementById('tog-arm-left');
  const togArmRightBtn = document.getElementById('tog-arm-right');

  // Inputs
  const inputHead = document.getElementById('file-head');
  const inputTorso = document.getElementById('file-torso');
  const inputArmLeft = document.getElementById('file-arm-left');
  const inputArmRight = document.getElementById('file-arm-right');
  const input3D = document.getElementById('file-3d');
  const bgFileUpload = document.getElementById('bg-file-upload');

  // Sliders
  const sliderHead = document.getElementById('scale-head');
  const sliderArms = document.getElementById('scale-arms');
  const slider3DScale = document.getElementById('scale-3d');
  const slider3DX = document.getElementById('offset-3d-x');
  const slider3DY = document.getElementById('offset-3d-y');

  // Stări salvate
  let showSkeleton = localStorage.getItem('app_showSkeleton') !== 'false';
  let enableCrop = localStorage.getItem('app_crop') !== 'false';
  let hideCamera = localStorage.getItem('app_hide_camera') === 'true';
  let show3D = localStorage.getItem('app_vis_3d') !== 'false';

  const partVis = {
    head: localStorage.getItem('app_vis_head') !== 'false',
    torso: localStorage.getItem('app_vis_torso') !== 'false',
    armLeft: localStorage.getItem('app_vis_armLeft') !== 'false',
    armRight: localStorage.getItem('app_vis_armRight') !== 'false'
  };

  // Matrice de Offset-uri pentru cele 8 Puncte de Modulație ale Torso-ului (4 stânga, 4 dreapta)
  let torsoGridOffsets = JSON.parse(localStorage.getItem('app_torso_grid_offsets')) || [
    {x:0, y:0}, {x:0, y:0}, {x:0, y:0}, {x:0, y:0}, // Partea Stângă (Top to Bottom)
    {x:0, y:0}, {x:0, y:0}, {x:0, y:0}, {x:0, y:0}  // Partea Dreaptă (Top to Bottom)
  ];

  let bgType = 'none';
  let customBgImg = null;

  const segmentAssets = {
    head: { type: null, element: null },
    torso: { type: null, element: null },
    armLeft: { type: null, element: null },
    armRight: { type: null, element: null }
  };

  let model3DData = null;
  const puppetScales = { head: 1.0, arms: 1.0, scale3D: 1.0, x3D: 0, y3D: 0 };

  // Three.js Context
  const threeScene = new THREE.Scene();
  const threeCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
  threeCamera.position.z = 5;
  const threeRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  threeRenderer.setSize(window.innerWidth, window.innerHeight);

  const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
  threeScene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(0, 1, 2);
  threeScene.add(dirLight);

  const gltfLoader = new THREE.GLTFLoader();

  const maskCanvas = document.createElement('canvas');
  const maskCtx = maskCanvas.getContext('2d');

  function resizeCanvas() {
    canvasElement.width = window.innerWidth;
    canvasElement.height = window.innerHeight;
    maskCanvas.width = window.innerWidth;
    maskCanvas.height = window.innerHeight;
    threeRenderer.setSize(window.innerWidth, window.innerHeight);
    threeCamera.left = -window.innerWidth / 2;
    threeCamera.right = window.innerWidth / 2;
    threeCamera.top = window.innerHeight / 2;
    threeCamera.bottom = -window.innerHeight / 2;
    threeCamera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Drag & Drop pentru Punctele de Modulație Torso
  let draggingTorsoPointIndex = -1;
  let activeTorsoPoints = [];

  canvasElement.addEventListener('mousedown', (e) => {
    const rect = canvasElement.getBoundingClientRect();
    const mouseX = rect.width - (e.clientX - rect.left); // Mirroring
    const mouseY = e.clientY - rect.top;

    for (let i = 0; i < activeTorsoPoints.length; i++) {
      const pt = activeTorsoPoints[i];
      if (Math.hypot(mouseX - pt.x, mouseY - pt.y) < 18) {
        draggingTorsoPointIndex = i;
        break;
      }
    }
  });

  canvasElement.addEventListener('mousemove', (e) => {
    if (draggingTorsoPointIndex === -1 || !activeTorsoPoints[draggingTorsoPointIndex]) return;
    const rect = canvasElement.getBoundingClientRect();
    const mouseX = rect.width - (e.clientX - rect.left);
    const mouseY = e.clientY - rect.top;

    const basePt = activeTorsoPoints[draggingTorsoPointIndex].base;
    torsoGridOffsets[draggingTorsoPointIndex].x = mouseX - basePt.x;
    torsoGridOffsets[draggingTorsoPointIndex].y = mouseY - basePt.y;

    localStorage.setItem('app_torso_grid_offsets', JSON.stringify(torsoGridOffsets));
  });

  window.addEventListener('mouseup', () => { draggingTorsoPointIndex = -1; });

  resetBtn.addEventListener('click', () => {
    torsoGridOffsets = Array(8).fill(null).map(() => ({x: 0, y: 0}));
    localStorage.removeItem('app_torso_grid_offsets');
    statusDiv.innerText = "Punctele de modulație au fost resetate!";
  });

  // Media Inputs
  function handleMediaInput(inputEl, storageKey, key) {
    inputEl.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const fileUrl = URL.createObjectURL(file);
      if (file.type.startsWith('video/')) {
        const vid = document.createElement('video');
        vid.src = fileUrl;
        vid.autoplay = true;
        vid.loop = true;
        vid.muted = true;
        vid.playsInline = true;
        vid.play();
        segmentAssets[key] = { type: 'video', element: vid };
        statusDiv.innerText = `Video încărcat pentru ${key}!`;
      } else {
        const img = new Image();
        img.onload = () => {
          segmentAssets[key] = { type: 'image', element: img };
          statusDiv.innerText = `Imagine încărcată pentru ${key}!`;
        };
        img.src = fileUrl;

        const reader = new FileReader();
        reader.onload = (event) => {
          try { localStorage.setItem(storageKey, event.target.result); } catch(err){}
        };
        reader.readAsDataURL(file);
      }
    });
  }

  handleMediaInput(inputHead, 'app_file_head', 'head');
  handleMediaInput(inputTorso, 'app_file_torso', 'torso');
  handleMediaInput(inputArmLeft, 'app_file_arm_left', 'armLeft');
  handleMediaInput(inputArmRight, 'app_file_arm_right', 'armRight');

  input3D.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      gltfLoader.parse(event.target.result, '', (gltf) => {
        if (model3DData) threeScene.remove(model3DData);
        model3DData = gltf.scene;
        threeScene.add(model3DData);
        statusDiv.innerText = "Model 3D încărcat!";
      });
    };
    reader.readAsArrayBuffer(file);
  });

  window.addEventListener('load', () => {
    ['head', 'torso', 'arm_left', 'arm_right'].forEach(part => {
      const saved = localStorage.getItem(`app_file_${part}`);
      const keyMap = { head: 'head', torso: 'torso', arm_left: 'armLeft', arm_right: 'armRight' };
      if (saved) {
        const img = new Image();
        img.onload = () => segmentAssets[keyMap[part]] = { type: 'image', element: img };
        img.src = saved;
      }
    });

    updateBtnState(togHeadBtn, partVis.head, "Cap");
    updateBtnState(togTorsoBtn, partVis.torso, "Torso");
    updateBtnState(togArmLeftBtn, partVis.armLeft, "Braț L");
    updateBtnState(togArmRightBtn, partVis.armRight, "Braț R");
    updateBtnState(toggleSkeletonBtn, showSkeleton, "Linii Tracking");
    updateBtnState(toggleCropBtn, enableCrop, "Crop AI");
    updateBtnState(toggleHideCamBtn, !hideCamera, "Camera", "SHOW", "HIDE");
    updateBtnState(tog3DBtn, show3D, "Model 3D");
  });

  function updateBtnState(btn, state, label, onTxt = "ON", offTxt = "OFF") {
    btn.classList.toggle('active', state);
    btn.innerText = `${label}: ${state ? onTxt : offTxt}`;
  }

  function bindToggle(btn, key, label, isGlobal = false) {
    btn.addEventListener('click', () => {
      if (isGlobal) {
        if (key === 'skeleton') { showSkeleton = !showSkeleton; localStorage.setItem('app_showSkeleton', showSkeleton); updateBtnState(btn, showSkeleton, label); }
        if (key === 'crop') { enableCrop = !enableCrop; localStorage.setItem('app_crop', enableCrop); updateBtnState(btn, enableCrop, label); }
        if (key === 'hideCam') { hideCamera = !hideCamera; localStorage.setItem('app_hide_camera', hideCamera); updateBtnState(btn, !hideCamera, label, "SHOW", "HIDE"); }
        if (key === 'show3d') { show3D = !show3D; localStorage.setItem('app_vis_3d', show3D); updateBtnState(btn, show3D, label); }
      } else {
        partVis[key] = !partVis[key];
        localStorage.setItem(`app_vis_${key}`, partVis[key]);
        updateBtnState(btn, partVis[key], label);
      }
    });
  }

  bindToggle(togHeadBtn, 'head', 'Cap');
  bindToggle(togTorsoBtn, 'torso', 'Torso');
  bindToggle(togArmLeftBtn, 'armLeft', 'Braț L');
  bindToggle(togArmRightBtn, 'armRight', 'Braț R');
  bindToggle(toggleSkeletonBtn, 'skeleton', 'Linii Tracking', true);
  bindToggle(toggleCropBtn, 'crop', 'Crop AI', true);
  bindToggle(toggleHideCamBtn, 'hideCam', 'Camera', true);
  bindToggle(tog3DBtn, 'show3d', 'Model 3D', true);

  sliderHead.addEventListener('input', (e) => puppetScales.head = parseFloat(e.target.value));
  sliderArms.addEventListener('input', (e) => puppetScales.arms = parseFloat(e.target.value));
  slider3DScale.addEventListener('input', (e) => puppetScales.scale3D = parseFloat(e.target.value));
  slider3DX.addEventListener('input', (e) => puppetScales.x3D = parseFloat(e.target.value));
  slider3DY.addEventListener('input', (e) => puppetScales.y3D = parseFloat(e.target.value));

  bgFileUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.type.startsWith('image/')) {
      bgType = 'image';
      bgVideoElement.pause();
      const img = new Image();
      img.onload = () => customBgImg = img;
      img.src = URL.createObjectURL(file);
    } else if (file.type.startsWith('video/')) {
      bgType = 'video';
      bgVideoElement.src = URL.createObjectURL(file);
      bgVideoElement.play();
    }
  });

  // Funcție de Rendersare pe Triunghi (Affine Texture Warp Transformation)
  function drawTexturedTriangle(ctx, img, x0, y0, x1, y1, x2, y2, u0, v0, u1, v1, u2, v2) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.closePath();
    ctx.clip();

    const delta = u0 * (v1 - v2) - v0 * (u1 - u2) + (u1 * v2 - u2 * v1);
    if (Math.abs(delta) < 0.0001) { ctx.restore(); return; }

    const deltaA = x0 * (v1 - v2) - v0 * (x1 - x2) + (x1 * v2 - x2 * v1);
    const deltaB = u0 * (x1 - x2) - x0 * (u1 - u2) + (u1 * x2 - u2 * x1);
    const deltaC = x0 * (u1 * v2 - u2 * v1) - u0 * (x1 * v2 - x2 * v1) + v0 * (x1 * u2 - x2 * u1);

    const deltaD = y0 * (v1 - v2) - v0 * (y1 - y2) + (y1 * v2 - y2 * v1);
    const deltaE = u0 * (y1 - y2) - y0 * (u1 - u2) + (u1 * y2 - u2 * y1);
    const deltaF = y0 * (u1 * v2 - u2 * v1) - u0 * (y1 * v2 - y2 * v1) + v0 * (y1 * u2 - u2 * u1);

    ctx.transform(
      deltaA / delta, deltaD / delta,
      deltaB / delta, deltaE / delta,
      deltaC / delta, deltaF / delta
    );

    ctx.drawImage(img, 0, 0);
    ctx.restore();
  }

  // Deformare Rețea (Mesh Warp) 4x4 Puncte pentru Torso
  function drawWarpedTorsoMesh(ctx, mediaEl, gridPoints) {
    if (!mediaEl) return;
    const imgW = mediaEl.videoWidth || mediaEl.width || 100;
    const imgH = mediaEl.videoHeight || mediaEl.height || 100;

    // Suprafața este împărțită în 3 benzi orizontale (4 niveluri de puncte stânga/dreapta)
    for (let i = 0; i < 3; i++) {
      const pL0 = gridPoints[i];
      const pL1 = gridPoints[i + 1];
      const pR0 = gridPoints[i + 4];
      const pR1 = gridPoints[i + 5];

      const u0 = 0,    v0 = (i / 3) * imgH;
      const u1 = imgW, v1 = (i / 3) * imgH;
      const u2 = 0,    v2 = ((i + 1) / 3) * imgH;
      const u3 = imgW, v3 = ((i + 1) / 3) * imgH;

      // Triunghiul 1: Top-Left, Top-Right, Bottom-Left
      drawTexturedTriangle(ctx, mediaEl, pL0.x, pL0.y, pR0.x, pR0.y, pL1.x, pL1.y, u0, v0, u1, v1, u2, v2);
      // Triunghiul 2: Top-Right, Bottom-Right, Bottom-Left
      drawTexturedTriangle(ctx, mediaEl, pR0.x, pR0.y, pR1.x, pR1.y, pL1.x, pL1.y, u1, v1, u3, v3, u2, v2);
    }
  }

  // Brațe Cadre Dublate
  function drawFramedSegment(ctx, assetObj, p1, p2, thickness = 40) {
    if (!assetObj || !assetObj.element) return;
    const element = assetObj.element;
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const distance = Math.hypot(dx, dy);
    if (distance < 10) return;

    const angle = Math.atan2(dy, dx);
    ctx.save();
    ctx.translate(p1.x, p1.y);
    ctx.rotate(angle);

    const drawWidth = thickness * puppetScales.arms;
    ctx.drawImage(element, 0, -drawWidth / 2, distance, drawWidth);
    ctx.restore();
  }

  function render3DAsset(model, x, y, scale) {
    if (!model) return;
    const w = canvasElement.width;
    const h = canvasElement.height;
    
    const threeX = (x + puppetScales.x3D) - w / 2;
    const threeY = -((y + puppetScales.y3D) - h / 2);

    model.position.set(threeX, threeY, 0);
    model.scale.set(scale * puppetScales.scale3D * 50, scale * puppetScales.scale3D * 50, scale * puppetScales.scale3D * 50);
  }

  // MediaPipe Setup
  const holistic = new Holistic({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}` });
  holistic.setOptions({ modelComplexity: 1, smoothLandmarks: true, enableSegmentation: true, smoothSegmentation: true, refineFaceLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

  holistic.onResults((results) => {
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.globalCompositeOperation = 'source-over';
    canvasCtx.clearRect(0, 0, w, h);

    // 1. Fundal & Crop
    if (hideCamera) {
      if (bgType === 'image' && customBgImg) canvasCtx.drawImage(customBgImg, 0, 0, w, h);
      else if (bgType === 'video' && bgVideoElement.readyState >= 2) canvasCtx.drawImage(bgVideoElement, 0, 0, w, h);
      else { canvasCtx.fillStyle = '#08080c'; canvasCtx.fillRect(0, 0, w, h); }
    } else if (enableCrop && results.segmentationMask) {
      maskCtx.save();
      maskCtx.globalCompositeOperation = 'source-over';
      maskCtx.clearRect(0, 0, w, h);
      maskCtx.drawImage(results.segmentationMask, 0, 0, w, h);
      maskCtx.globalCompositeOperation = 'source-in';
      maskCtx.drawImage(results.image, 0, 0, w, h);
      maskCtx.restore();

      if (bgType === 'image' && customBgImg) canvasCtx.drawImage(customBgImg, 0, 0, w, h);
      else if (bgType === 'video' && bgVideoElement.readyState >= 2) canvasCtx.drawImage(bgVideoElement, 0, 0, w, h);
      else { canvasCtx.fillStyle = '#08080c'; canvasCtx.fillRect(0, 0, w, h); }

      canvasCtx.drawImage(maskCanvas, 0, 0, w, h);
    } else {
      canvasCtx.drawImage(results.image, 0, 0, w, h);
    }

    // 2. Ancorare Puncte Rigging
    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const pts = {
        nose:          { x: lm[0].x * w,  y: lm[0].y * h },
        leftShoulder:  { x: lm[11].x * w, y: lm[11].y * h },
        rightShoulder: { x: lm[12].x * w, y: lm[12].y * h },
        leftElbow:     { x: lm[13].x * w, y: lm[13].y * h },
        rightElbow:    { x: lm[14].x * w, y: lm[14].y * h },
        leftWrist:     { x: lm[15].x * w, y: lm[15].y * h },
        rightWrist:    { x: lm[16].x * w, y: lm[16].y * h },
        leftHip:       { x: lm[23].x * w, y: lm[23].y * h },
        rightHip:      { x: lm[24].x * w, y: lm[24].y * h }
      };

      const shoulderWidth = Math.hypot(pts.rightShoulder.x - pts.leftShoulder.x, pts.rightShoulder.y - pts.leftShoulder.y);

      // Calculare 8 Baze pentru Rețeaua Torso (4 Puncte Stânga, 4 Puncte Dreapta)
      activeTorsoPoints = [];
      for (let i = 0; i < 4; i++) {
        const ratio = i / 3;
        // Partea Stângă
        const baseLx = pts.leftShoulder.x + (pts.leftHip.x - pts.leftShoulder.x) * ratio;
        const baseLy = pts.leftShoulder.y + (pts.leftHip.y - pts.leftShoulder.y) * ratio;
        activeTorsoPoints[i] = {
          x: baseLx + torsoGridOffsets[i].x,
          y: baseLy + torsoGridOffsets[i].y,
          base: { x: baseLx, y: baseLy }
        };

        // Partea Dreaptă
        const baseRx = pts.rightShoulder.x + (pts.rightHip.x - pts.rightShoulder.x) * ratio;
        const baseRy = pts.rightShoulder.y + (pts.rightHip.y - pts.rightShoulder.y) * ratio;
        activeTorsoPoints[i + 4] = {
          x: baseRx + torsoGridOffsets[i + 4].x,
          y: baseRy + torsoGridOffsets[i + 4].y,
          base: { x: baseRx, y: baseRy }
        };
      }

      // A. CAP (Foto/Video)
      if (partVis.head && segmentAssets.head.element) {
        const headW = shoulderWidth * 1.2 * puppetScales.head;
        const el = segmentAssets.head.element;
        const headH = (el.videoHeight || el.height || 1) / (el.videoWidth || el.width || 1) * headW;
        canvasCtx.drawImage(el, pts.nose.x - headW/2, pts.nose.y - headH/2, headW, headH);
      }

      // B. TORSO WARP MESH (Modulare Foto/Video pe Rețeaua de 8 Puncte)
      if (partVis.torso && segmentAssets.torso.element) {
        drawWarpedTorsoMesh(canvasCtx, segmentAssets.torso.element, activeTorsoPoints);
      }

      // C. BRAȚE
      if (partVis.armLeft && segmentAssets.armLeft.element) {
        drawFramedSegment(canvasCtx, segmentAssets.armLeft, pts.leftShoulder, pts.leftElbow, 35);
        drawFramedSegment(canvasCtx, segmentAssets.armLeft, pts.leftElbow, pts.leftWrist, 30);
      }

      if (partVis.armRight && segmentAssets.armRight.element) {
        drawFramedSegment(canvasCtx, segmentAssets.armRight, pts.rightShoulder, pts.rightElbow, 35);
        drawFramedSegment(canvasCtx, segmentAssets.armRight, pts.rightElbow, pts.rightWrist, 30);
      }

      // D. MODEL 3D
      if (show3D && model3DData) {
        render3DAsset(model3DData, pts.nose.x, pts.nose.y, puppetScales.head);
        threeRenderer.render(threeScene, threeCamera);
        canvasCtx.drawImage(threeRenderer.domElement, 0, 0);
      }

      // 3. LINII TRACKING & PUNCTE DE MODULAȚIE
      if (showSkeleton) {
        // Desenare Linii Rețea Mesh Torso
        canvasCtx.strokeStyle = '#00ffcc';
        canvasCtx.lineWidth = 1.5;
        for (let i = 0; i < 3; i++) {
          canvasCtx.beginPath();
          canvasCtx.moveTo(activeTorsoPoints[i].x, activeTorsoPoints[i].y);
          canvasCtx.lineTo(activeTorsoPoints[i+1].x, activeTorsoPoints[i+1].y);
          canvasCtx.lineTo(activeTorsoPoints[i+5].x, activeTorsoPoints[i+5].y);
          canvasCtx.lineTo(activeTorsoPoints[i+4].x, activeTorsoPoints[i+4].y);
          canvasCtx.closePath();
          canvasCtx.fillStyle = 'rgba(0, 255, 204, 0.08)';
          canvasCtx.fill();
          canvasCtx.stroke();
        }

        // Puncte de Modulație Torso (Inel cu Culoare Interactivă)
        activeTorsoPoints.forEach((pt, idx) => {
          canvasCtx.beginPath();
          canvasCtx.arc(pt.x, pt.y, 8, 0, 2 * Math.PI);
          canvasCtx.fillStyle = (idx === draggingTorsoPointIndex) ? '#ff0055' : '#00ffcc';
          canvasCtx.strokeStyle = '#ffffff';
          canvasCtx.lineWidth = 2;
          canvasCtx.fill();
          canvasCtx.stroke();
        });

        // Brațe
        const drawArmFrame = (p1, p2, width) => {
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const len = Math.hypot(dx, dy);
          if (len < 5) return;
          const nx = -dy / len * (width / 2);
          const ny = dx / len * (width / 2);

          canvasCtx.beginPath();
          canvasCtx.moveTo(p1.x + nx, p1.y + ny);
          canvasCtx.lineTo(p2.x + nx, p2.y + ny);
          canvasCtx.lineTo(p2.x - nx, p2.y - ny);
          canvasCtx.lineTo(p1.x - nx, p1.y - ny);
          canvasCtx.closePath();
          canvasCtx.strokeStyle = '#ff0055';
          canvasCtx.lineWidth = 1.5;
          canvasCtx.stroke();
        };

        drawArmFrame(pts.leftShoulder, pts.leftElbow, 30 * puppetScales.arms);
        drawArmFrame(pts.leftElbow, pts.leftWrist, 25 * puppetScales.arms);
        drawArmFrame(pts.rightShoulder, pts.rightElbow, 30 * puppetScales.arms);
        drawArmFrame(pts.rightElbow, pts.rightWrist, 25 * puppetScales.arms);

        // Cap
        canvasCtx.beginPath();
        canvasCtx.arc(pts.nose.x, pts.nose.y, shoulderWidth * 0.35, 0, 2 * Math.PI);
        canvasCtx.strokeStyle = '#00f2fe';
        canvasCtx.lineWidth = 1.5;
        canvasCtx.stroke();
      }
    }

    if (showSkeleton) {
      if (results.leftHandLandmarks) drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 1 });
      if (results.rightHandLandmarks) drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 1 });
    }

    canvasCtx.restore();
  });

  // Start Engine
  startBtn.addEventListener('click', async () => {
    statusDiv.innerText = "Se pornește camera...";
    startBtn.style.display = 'none';
    let camera = new Camera(videoElement, {
      onFrame: async () => { await holistic.send({ image: videoElement }); },
      width: 1280,
      height: 720
    });
    await camera.start();
    statusDiv.innerText = "Sistem Activ • Modulație Torso Mesh Pregătită!";
  });
</script>

</body>
</html>
