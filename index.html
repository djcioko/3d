<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VTuber Studio v3.0 - Full 3D & 2D Features</title>

  <!-- MediaPipe CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <!-- Three.js CDN pentru Modele 3D GLB -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0;
      padding: 10px;
      background: #090d16;
      color: #38bdf8;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .version-tag {
      background: #10b981;
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 6px;
    }

    h3 { margin: 4px 0 10px 0; color: #38bdf8; text-align: center; font-size: 16px; display: flex; align-items: center; }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1/1;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #10b981;
      background: #000;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
      touch-action: none;
      cursor: grab;
    }

    .canvas-container:active { cursor: grabbing; }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #webcam, #bgVideoElement { display: none; }

    .controls-panel {
      width: 100%;
      max-width: 400px;
      margin-top: 10px;
      background: #111827;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #1f2937;
      font-size: 12px;
    }

    .section-title {
      font-weight: bold;
      color: #94a3b8;
      margin: 10px 0 6px 0;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 2px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .btn {
      flex: 1 1 calc(50% - 6px);
      padding: 8px;
      background: #1e293b;
      border: 1px solid #0284c7;
      color: #38bdf8;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
      font-size: 11px;
      transition: all 0.2s;
    }

    .btn.active { background: #0284c7; color: #fff; }
    .btn-full { flex: 1 1 100%; }

    .btn-record { background: #dc2626; border-color: #b91c1c; color: #fff; }
    .btn-record.recording { background: #ef4444; animation: pulse 1s infinite; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .btn-fullscreen { background: #10b981; border-color: #059669; color: #fff; }
    input[type="file"] { display: none; }

    select.select-device {
      width: 100%;
      padding: 8px;
      background: #1e293b;
      border: 1px solid #10b981;
      color: #38bdf8;
      border-radius: 6px;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .gallery {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 8px 0;
      margin-bottom: 6px;
      min-height: 62px;
    }

    .gallery-item {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 6px;
      border: 2px solid #334155;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #38bdf8;
    }

    .gallery-item.active { border-color: #10b981; box-shadow: 0 0 8px #10b981; }
    .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }

    .delete-btn {
      position: absolute;
      top: 1px;
      right: 1px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
