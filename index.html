<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D & 3D Puppet Rigging - v2.3 PNG + GLB Dual Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #08080c;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam, #output_canvas, #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
    #webcam, #bg-video {
      display: none;
    }
    #output_canvas {
      z-index: 2;
      transform: scaleX(-1);
      cursor: crosshair;
    }

    /* Control Panel */
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 370px;
      max-height: 92vh;
      overflow-y: auto;
      background: rgba(15, 15, 25, 0.92);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .btn-main {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      border: none;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-main:hover {
      transform: scale(1.02);
    }

    .btn-toggle {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 5px 8px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      min-width: 65px;
      text-align: center;
    }
    .btn-toggle.active {
      background: rgba(0, 255, 204, 0.3);
      border-color: #00ffcc;
      color: #00ffcc;
      font-weight: bold;
    }

    .upload-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }
    .upload-group label {
      color: #00ffcc;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .file-input {
      color: #ccc;
      font-size: 11px;
      flex: 1;
    }

    .row-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scale-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 11px;
    }
    .scale-controls input[type="range"] {
      flex: 1;
    }

    #status {
      color: #00ffcc;
      font-size: 12px;
      font-weight: bold;
    }
  </style>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  
  <!-- Three.js pentru Renderare Modele 3D GLB/GLTF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="container">
  <div id="ui-overlay">
    <button id="start-btn" class="btn-main">▶ Pornire Engine 2D/3D v2.3</button>
    <div id="status">Apasă pe buton pentru start...</div>

    <!-- Switchuri Globale Layer-e -->
    <div class="upload-group">
      <label>Comutatoare Generale</label>
      <div class="row-btns">
        <button id="toggle-skeleton" class="btn-toggle active">Linii Tracking: ON</button>
        <button id="toggle-crop" class="btn-toggle active">Crop AI: ON</button>
        <button id="reset-offsets" class="btn-toggle" style="border-color:#ff0055; color:#ff3366;">Reset Calibrare</button>
      </div>
    </div>

    <!-- Upload PNG & GLB pe Fiecare Fragment -->
    <div class="upload-group">
      <label>Încărcare Fișiere (PNG / JPG / GLB / GLTF)</label>
      
      <!-- 1. CAP -->
      <div class="item-row">
        <button id="tog-head" class="btn-toggle active">Cap: ON</button>
        <input type="file" id="file-head" accept="image/*,.glb,.gltf" class="file-input">
      </div>

      <!-- 2. TORSO -->
      <div class="item-row">
        <button id="tog-torso" class="btn-toggle active">Torso: ON</button>
        <input type="file" id="file-torso" accept="image/*,.glb,.gltf" class="file-input">
      </div>

      <!-- 3. BRAȚ STÂNG -->
      <div class="item-row">
        <button id="tog-arm-left" class="btn-toggle active">Braț L: ON</button>
        <input type="file" id="file-arm-left" accept="image/*,.glb,.gltf" class="file-input">
      </div>

      <!-- 4. BRAȚ DREPT -->
      <div class="item-row">
        <button id="tog-arm-right" class="btn-toggle active">Braț R: ON</button>
        <input type="file" id="file-arm-right" accept="image/*,.glb,.gltf" class="file-input">
      </div>
    </div>

    <!-- Ajustări Free-Form Mască / Cap -->
    <div class="upload-group">
      <label>Calibrare Free-Form Cap (Scală & Offsets)</label>
      <div class="scale-controls">
        <span>Scală Cap:</span>
        <input type="range" id="scale-head" min="0.3" max="3.0" step="0.05" value="1.0">
      </div>
      <div class="scale-controls">
        <span>Ajustare Y (Sus / Jos):</span>
        <input type="range" id="offset-head-y" min="-150" max="150" step="2" value="0">
      </div>
      <div class="scale-controls">
        <span>Ajustare X (Stânga / Dreapta):</span>
        <input type="range" id="offset-head-x" min="-150" max="150" step="2" value="0">
      </div>
    </div>

    <!-- Scalare Corp -->
    <div class="upload-group">
      <label>Scalare Torso & Brațe</label>
      <div class="scale-controls">
        <span>Scală Torso:</span>
        <input type="range" id="scale-torso" min="0.5" max="3.0" step="0.1" value="1.0">
      </div>
      <div class="scale-controls">
        <span>Grosime Brațe:</span>
        <input type="range" id="scale-arms" min="0.5" max="3.0" step="0.1" value="1.0">
      </div>
    </div>

    <!-- Fundal -->
    <div class="upload-group">
      <label>Fundal Custom</label>
      <input type="file" id="bg-file-upload" accept="image/*,video/*" class="file-input">
    </div>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <video id="bg-video" autoplay loop muted playsinline></video>
  <canvas id="output_canvas"></canvas>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const bgVideoElement = document.getElementById('bg-video');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');

  const startBtn = document.getElementById('start-btn');
  const statusDiv = document.getElementById('status');
  const resetBtn = document.getElementById('reset-offsets');

  // Toggle BTNs Globale
  const toggleSkeletonBtn = document.getElementById('toggle-skeleton');
  const toggleCropBtn = document.getElementById('toggle-crop');

  // Toggle BTNs Individuale
  const togHeadBtn = document.getElementById('tog-head');
  const togTorsoBtn = document.getElementById('tog-torso');
  const togArmLeftBtn = document.getElementById('tog-arm-left');
  const togArmRightBtn = document.getElementById('tog-arm-right');

  // Inputs
  const inputHead = document.getElementById('file-head');
  const inputTorso = document.getElementById('file-torso');
  const inputArmLeft = document.getElementById('file-arm-left');
  const inputArmRight = document.getElementById('file-arm-right');
  const bgFileUpload = document.getElementById('bg-file-upload');

  // Sliders
  const sliderHead = document.getElementById('scale-head');
  const sliderHeadY = document.getElementById('offset-head-y');
  const sliderHeadX = document.getElementById('offset-head-x');
  const sliderTorso = document.getElementById('scale-torso');
  const sliderArms = document.getElementById('scale-arms');

  // Stări ON / OFF
  let showSkeleton = localStorage.getItem('app_showSkeleton') !== 'false';
  let enableCrop = localStorage.getItem('app_crop') !== 'false';

  const partVis = {
    head: localStorage.getItem('app_vis_head') !== 'false',
    torso: localStorage.getItem('app_vis_torso') !== 'false',
    armLeft: localStorage.getItem('app_vis_armLeft') !== 'false',
    armRight: localStorage.getItem('app_vis_armRight') !== 'false'
  };

  let shoulderOffsets = JSON.parse(localStorage.getItem('app_shoulder_offsets')) || {
    left: { x: 0, y: 0 },
    right: { x: 0, y: 0 }
  };

  let headOffsetY = parseFloat(localStorage.getItem('app_head_offset_y')) || 0;
  let headOffsetX = parseFloat(localStorage.getItem('app_head_offset_x')) || 0;

  sliderHeadY.value = headOffsetY;
  sliderHeadX.value = headOffsetX;

  let bgType = 'none';
  let customBgImg = null;

  // Stocare Active (Suportă 2D & 3D)
  const puppetAssets = {
    head: { type: null, data: null },
    torso: { type: null, data: null },
    armLeft: { type: null, data: null },
    armRight: { type: null, data: null }
  };

  const puppetScales = { head: 1.0, torso: 1.0, arms: 1.0 };

  // Three.js Offscreen Scene pentru renderare modele 3D
  const threeScene = new THREE.Scene();
  const threeCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
  threeCamera.position.z = 5;
  const threeRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  threeRenderer.setSize(window.innerWidth, window.innerHeight);

  const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
  threeScene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(0, 1, 2);
  threeScene.add(dirLight);

  const gltfLoader = new THREE.GLTFLoader();

  const maskCanvas = document.createElement('canvas');
  const maskCtx = maskCanvas.getContext('2d');

  function resizeCanvas() {
    canvasElement.width = window.innerWidth;
    canvasElement.height = window.innerHeight;
    maskCanvas.width = window.innerWidth;
    maskCanvas.height = window.innerHeight;
    threeRenderer.setSize(window.innerWidth, window.innerHeight);
    threeCamera.left = -window.innerWidth / 2;
    threeCamera.right = window.innerWidth / 2;
    threeCamera.top = window.innerHeight / 2;
    threeCamera.bottom = -window.innerHeight / 2;
    threeCamera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Mouse Drag for Shoulder Calibration
  let draggingPoint = null;
  let currentPoints = {};

  canvasElement.addEventListener('mousedown', (e) => {
    const rect = canvasElement.getBoundingClientRect();
    const mouseX = rect.width - (e.clientX - rect.left);
    const mouseY = e.clientY - rect.top;

    if (currentPoints.leftShoulder && Math.hypot(mouseX - currentPoints.leftShoulder.x, mouseY - currentPoints.leftShoulder.y) < 25) {
      draggingPoint = 'leftShoulder';
    } else if (currentPoints.rightShoulder && Math.hypot(mouseX - currentPoints.rightShoulder.x, mouseY - currentPoints.rightShoulder.y) < 25) {
      draggingPoint = 'rightShoulder';
    }
  });

  canvasElement.addEventListener('mousemove', (e) => {
    if (!draggingPoint || !currentPoints.rawLeftShoulder) return;
    const rect = canvasElement.getBoundingClientRect();
    const mouseX = rect.width - (e.clientX - rect.left);
    const mouseY = e.clientY - rect.top;

    if (draggingPoint === 'leftShoulder') {
      shoulderOffsets.left.x = mouseX - currentPoints.rawLeftShoulder.x;
      shoulderOffsets.left.y = mouseY - currentPoints.rawLeftShoulder.y;
    } else if (draggingPoint === 'rightShoulder') {
      shoulderOffsets.right.x = mouseX - currentPoints.rawRightShoulder.x;
      shoulderOffsets.right.y = mouseY - currentPoints.rawRightShoulder.y;
    }
    localStorage.setItem('app_shoulder_offsets', JSON.stringify(shoulderOffsets));
  });

  window.addEventListener('mouseup', () => { draggingPoint = null; });

  resetBtn.addEventListener('click', () => {
    shoulderOffsets = { left: { x: 0, y: 0 }, right: { x: 0, y: 0 } };
    headOffsetY = 0; headOffsetX = 0;
    sliderHeadY.value = 0; sliderHeadX.value = 0;
    localStorage.removeItem('app_shoulder_offsets');
    localStorage.removeItem('app_head_offset_y');
    localStorage.removeItem('app_head_offset_x');
    statusDiv.innerText = "Calibrare resatată!";
  });

  // Încărcător Universal (PNG 2D & GLB 3D)
  function handleFileInput(inputEl, storageKey, objKey) {
    inputEl.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();
      const reader = new FileReader();

      if (fileName.endsWith('.glb') || fileName.endsWith('.gltf')) {
        reader.onload = (event) => {
          const arrayBuffer = event.target.result;
          gltfLoader.parse(arrayBuffer, '', (gltf) => {
            if (puppetAssets[objKey].data && puppetAssets[objKey].type === '3d') {
              threeScene.remove(puppetAssets[objKey].data);
            }
            const model = gltf.scene;
            threeScene.add(model);
            puppetAssets[objKey] = { type: '3d', data: model };
            statusDiv.innerText = `Model 3D GLB încărcat pt ${objKey}!`;
          });
        };
        reader.readAsArrayBuffer(file);
      } else {
        reader.onload = (event) => {
          const dataUrl = event.target.result;
          const img = new Image();
          img.onload = () => {
            if (puppetAssets[objKey].data && puppetAssets[objKey].type === '3d') {
              threeScene.remove(puppetAssets[objKey].data);
            }
            puppetAssets[objKey] = { type: '2d', data: img };
            statusDiv.innerText = `Imagine 2D încărcată pt ${objKey}!`;
          };
          img.src = dataUrl;
          try { localStorage.setItem(storageKey, dataUrl); } catch(e){}
        };
        reader.readAsDataURL(file);
      }
    });
  }

  handleFileInput(inputHead, 'app_file_head', 'head');
  handleFileInput(inputTorso, 'app_file_torso', 'torso');
  handleFileInput(inputArmLeft, 'app_file_arm_left', 'armLeft');
  handleFileInput(inputArmRight, 'app_file_arm_right', 'armRight');

  window.addEventListener('load', () => {
    ['head', 'torso', 'arm_left', 'arm_right'].forEach(part => {
      const saved = localStorage.getItem(`app_file_${part}`);
      const keyMap = { head: 'head', torso: 'torso', arm_left: 'armLeft', arm_right: 'armRight' };
      if (saved) {
        const img = new Image();
        img.onload = () => puppetAssets[keyMap[part]] = { type: '2d', data: img };
        img.src = saved;
      }
    });

    updateBtnState(togHeadBtn, partVis.head, "Cap");
    updateBtnState(togTorsoBtn, partVis.torso, "Torso");
    updateBtnState(togArmLeftBtn, partVis.armLeft, "Braț L");
    updateBtnState(togArmRightBtn, partVis.armRight, "Braț R");
    updateBtnState(toggleSkeletonBtn, showSkeleton, "Linii Tracking");
    updateBtnState(toggleCropBtn, enableCrop, "Crop AI");
  });

  function updateBtnState(btn, state, label) {
    btn.classList.toggle('active', state);
    btn.innerText = `${label}: ${state ? 'ON' : 'OFF'}`;
  }

  function bindToggle(btn, key, label, isGlobal = false) {
    btn.addEventListener('click', () => {
      if (isGlobal) {
        if (key === 'skeleton') { showSkeleton = !showSkeleton; localStorage.setItem('app_showSkeleton', showSkeleton); updateBtnState(btn, showSkeleton, label); }
        if (key === 'crop') { enableCrop = !enableCrop; localStorage.setItem('app_crop', enableCrop); updateBtnState(btn, enableCrop, label); }
      } else {
        partVis[key] = !partVis[key];
        localStorage.setItem(`app_vis_${key}`, partVis[key]);
        updateBtnState(btn, partVis[key], label);
      }
    });
  }

  bindToggle(togHeadBtn, 'head', 'Cap');
  bindToggle(togTorsoBtn, 'torso', 'Torso');
  bindToggle(togArmLeftBtn, 'armLeft', 'Braț L');
  bindToggle(togArmRightBtn, 'armRight', 'Braț R');
  bindToggle(toggleSkeletonBtn, 'skeleton', 'Linii Tracking', true);
  bindToggle(toggleCropBtn, 'crop', 'Crop AI', true);

  sliderHead.addEventListener('input', (e) => puppetScales.head = parseFloat(e.target.value));
  sliderTorso.addEventListener('input', (e) => puppetScales.torso = parseFloat(e.target.value));
  sliderArms.addEventListener('input', (e) => puppetScales.arms = parseFloat(e.target.value));

  sliderHeadY.addEventListener('input', (e) => { headOffsetY = parseFloat(e.target.value); localStorage.setItem('app_head_offset_y', headOffsetY); });
  sliderHeadX.addEventListener('input', (e) => { headOffsetX = parseFloat(e.target.value); localStorage.setItem('app_head_offset_x', headOffsetX); });

  bgFileUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.type.startsWith('image/')) {
      bgType = 'image';
      bgVideoElement.pause();
      const img = new Image();
      img.onload = () => customBgImg = img;
      img.src = URL.createObjectURL(file);
    } else if (file.type.startsWith('video/')) {
      bgType = 'video';
      bgVideoElement.src = URL.createObjectURL(file);
      bgVideoElement.play();
    }
  });

  // Renderare Segment 2D
  function drawBoneSegment(ctx, img, p1, p2, scaleFactor = 1.0) {
    if (!img) return;
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const distance = Math.hypot(dx, dy);
    if (distance < 15) return;

    const angle = Math.atan2(dy, dx);
    ctx.save();
    ctx.translate(p1.x, p1.y);
    ctx.rotate(angle);
    const drawLength = distance;
    const drawWidth = (img.height * (drawLength / img.width)) * scaleFactor;
    ctx.drawImage(img, 0, -drawWidth / 2, drawLength, drawWidth);
    ctx.restore();
  }

  // Renderare Model 3D pe Pozitie Canvas
  function render3DAsset(model, x, y, scale, rotZ = 0) {
    if (!model) return;
    const w = canvasElement.width;
    const h = canvasElement.height;
    
    // Convertește coordonatele de pixel în coordonate Three.js Orthographic
    const threeX = x - w / 2;
    const threeY = -(y - h / 2);

    model.position.set(threeX, threeY, 0);
    model.scale.set(scale * 50, scale * 50, scale * 50);
    model.rotation.z = rotZ;
  }

  // MediaPipe Setup
  const holistic = new Holistic({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}` });
  holistic.setOptions({ modelComplexity: 1, smoothLandmarks: true, enableSegmentation: true, smoothSegmentation: true, refineFaceLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

  holistic.onResults((results) => {
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);

    // 1. FUNDAL & CROP AI
    if (enableCrop && results.segmentationMask) {
      maskCtx.save();
      maskCtx.clearRect(0, 0, w, h);
      maskCtx.drawImage(results.segmentationMask, 0, 0, w, h);
      maskCtx.globalCompositeOperation = 'source-in';
      maskCtx.drawImage(results.image, 0, 0, w, h);
      maskCtx.restore();

      if (bgType === 'image' && customBgImg) canvasCtx.drawImage(customBgImg, 0, 0, w, h);
      else if (bgType === 'video' && bgVideoElement.readyState >= 2) canvasCtx.drawImage(bgVideoElement, 0, 0, w, h);
      else { canvasCtx.fillStyle = '#0a0a10'; canvasCtx.fillRect(0, 0, w, h); }

      canvasCtx.drawImage(maskCanvas, 0, 0, w, h);
    } else {
      canvasCtx.drawImage(results.image, 0, 0, w, h);
    }

    // 2. TRACKING & ANCORARE DUAL ENGINE (2D + 3D)
    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const rawLeftShoulder = { x: lm[11].x * w, y: lm[11].y * h };
      const rawRightShoulder = { x: lm[12].x * w, y: lm[12].y * h };

      const pts = {
        nose:          { x: lm[0].x * w + headOffsetX,  y: lm[0].y * h + headOffsetY },
        leftShoulder:  { x: rawLeftShoulder.x + shoulderOffsets.left.x, y: rawLeftShoulder.y + shoulderOffsets.left.y },
        rightShoulder: { x: rawRightShoulder.x + shoulderOffsets.right.x, y: rawRightShoulder.y + shoulderOffsets.right.y },
        leftElbow:     { x: lm[13].x * w, y: lm[13].y * h },
        rightElbow:    { x: lm[14].x * w, y: lm[14].y * h },
        leftWrist:     { x: lm[15].x * w, y: lm[15].y * h },
        rightWrist:    { x: lm[16].x * w, y: lm[16].y * h },
        leftHip:       { x: lm[23].x * w, y: lm[23].y * h },
        rightHip:      { x: lm[24].x * w, y: lm[24].y * h }
      };

      currentPoints = { ...pts, rawLeftShoulder, rawRightShoulder };
      const shoulderWidth = Math.hypot(pts.rightShoulder.x - pts.leftShoulder.x, pts.rightShoulder.y - pts.leftShoulder.y);

      let has3D = false;

      // A. CAP (2D sau 3D)
      if (partVis.head && puppetAssets.head.data) {
        if (puppetAssets.head.type === '2d') {
          const headW = shoulderWidth * 1.2 * puppetScales.head;
          const headH = (puppetAssets.head.data.height / puppetAssets.head.data.width) * headW;
          canvasCtx.drawImage(puppetAssets.head.data, pts.nose.x - headW/2, pts.nose.y - headH/2, headW, headH);
        } else if (puppetAssets.head.type === '3d') {
          render3DAsset(puppetAssets.head.data, pts.nose.x, pts.nose.y, puppetScales.head);
          has3D = true;
        }
      }

      // B. TORSO (2D sau 3D)
      if (partVis.torso && puppetAssets.torso.data) {
        const chestCenter = { x: (pts.leftShoulder.x + pts.rightShoulder.x)/2, y: (pts.leftShoulder.y + pts.leftHip.y)/2 };
        if (puppetAssets.torso.type === '2d') {
          const torsoW = shoulderWidth * 1.6 * puppetScales.torso;
          const torsoH = (puppetAssets.torso.data.height / puppetAssets.torso.data.width) * torsoW;
          canvasCtx.drawImage(puppetAssets.torso.data, chestCenter.x - torsoW/2, chestCenter.y - torsoH/2, torsoW, torsoH);
        } else if (puppetAssets.torso.type === '3d') {
          render3DAsset(puppetAssets.torso.data, chestCenter.x, chestCenter.y, puppetScales.torso);
          has3D = true;
        }
      }

      // C. BRAȚE (2D sau 3D)
      if (partVis.armLeft && puppetAssets.armLeft.data) {
        if (puppetAssets.armLeft.type === '2d') drawBoneSegment(canvasCtx, puppetAssets.armLeft.data, pts.leftShoulder, pts.leftElbow, puppetScales.arms);
        else if (puppetAssets.armLeft.type === '3d') { render3DAsset(puppetAssets.armLeft.data, pts.leftShoulder.x, pts.leftShoulder.y, puppetScales.arms); has3D = true; }
      }

      if (partVis.armRight && puppetAssets.armRight.data) {
        if (puppetAssets.armRight.type === '2d') drawBoneSegment(canvasCtx, puppetAssets.armRight.data, pts.rightShoulder, pts.rightElbow, puppetScales.arms);
        else if (puppetAssets.armRight.type === '3d') { render3DAsset(puppetAssets.armRight.data, pts.rightShoulder.x, pts.rightShoulder.y, puppetScales.arms); has3D = true; }
      }

      // Suprapunere Render 3D peste Canvas
      if (has3D) {
        threeRenderer.render(threeScene, threeCamera);
        canvasCtx.drawImage(threeRenderer.domElement, 0, 0);
      }

      // --- SKELETON & DRAG HANDLES ---
      if (showSkeleton) {
        // Poligon Bust
        canvasCtx.beginPath();
        canvasCtx.moveTo(pts.leftShoulder.x, pts.leftShoulder.y);
        canvasCtx.lineTo(pts.rightShoulder.x, pts.rightShoulder.y);
        canvasCtx.lineTo(pts.rightHip.x, pts.rightHip.y);
        canvasCtx.lineTo(pts.leftHip.x, pts.leftHip.y);
        canvasCtx.closePath();
        canvasCtx.fillStyle = 'rgba(0, 255, 204, 0.15)';
        canvasCtx.fill();
        canvasCtx.strokeStyle = '#00ffcc';
        canvasCtx.lineWidth = 2;
        canvasCtx.stroke();

        // Cerc Cap
        canvasCtx.beginPath();
        canvasCtx.arc(pts.nose.x, pts.nose.y, shoulderWidth * 0.35, 0, 2 * Math.PI);
        canvasCtx.strokeStyle = '#00f2fe';
        canvasCtx.lineWidth = 2;
        canvasCtx.stroke();

        // Linii Brațe
        const arms = [
          [pts.leftShoulder, pts.leftElbow], [pts.leftElbow, pts.leftWrist],
          [pts.rightShoulder, pts.rightElbow], [pts.rightElbow, pts.rightWrist]
        ];
        canvasCtx.strokeStyle = '#ff0055';
        canvasCtx.lineWidth = 3;
        arms.forEach(([p1, p2]) => {
          canvasCtx.beginPath();
          canvasCtx.moveTo(p1.x, p1.y);
          canvasCtx.lineTo(p2.x, p2.y);
          canvasCtx.stroke();
        });

        // Articulații
        Object.values(pts).forEach((p) => {
          canvasCtx.beginPath();
          canvasCtx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
          canvasCtx.fillStyle = '#ffff00';
          canvasCtx.fill();
          canvasCtx.stroke();
        });

        // PUNCTE DRAG & DROP UMERI
        [pts.leftShoulder, pts.rightShoulder].forEach((p) => {
          canvasCtx.beginPath();
          canvasCtx.arc(p.x, p.y, 10, 0, 2 * Math.PI);
          canvasCtx.fillStyle = 'rgba(0, 255, 204, 0.6)';
          canvasCtx.strokeStyle = '#ffffff';
          canvasCtx.lineWidth = 2;
          canvasCtx.fill();
          canvasCtx.stroke();
        });
      }
    }

    if (showSkeleton) {
      if (results.leftHandLandmarks) drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 1.5 });
      if (results.rightHandLandmarks) drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 1.5 });
    }

    canvasCtx.restore();
  });

  // Start Camera
  startBtn.addEventListener('click', async () => {
    statusDiv.innerText = "Se pornește sistemul...";
    startBtn.style.display = 'none';
    let camera = new Camera(videoElement, {
      onFrame: async () => { await holistic.send({ image: videoElement }); },
      width: 1280,
      height: 720
    });
    await camera.start();
    statusDiv.innerText = "v2.3 Activ • Suport 2D PNG & 3D GLB Pregătit!";
  });
</script>

</body>
</html>
