<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VTuber Studio v2.5 - Final Torso & Body Mapping</title>

  <!-- MediaPipe CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    body, html {
      width: 100vw; height: 100vh; overflow: hidden;
      background-color: #050508; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #app-container { width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; width: 100vw; height: 100vh; background: #000; cursor: crosshair; }
    #webcam, #torsoVid, #bgVid { display: none; }

    /* Panou Control Stânga */
    #control-panel {
      position: absolute; top: 15px; left: 15px; z-index: 30;
      background: rgba(10, 10, 20, 0.92); padding: 14px;
      border-radius: 12px; border: 1px solid rgba(0, 255, 204, 0.4);
      backdrop-filter: blur(12px); display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7); width: 320px; max-height: 90vh; overflow-y: auto;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    #control-panel.hidden { transform: translateX(-110%); opacity: 0; pointer-events: none; }

    .panel-section { display: flex; flex-direction: column; gap: 6px; font-size: 11px; }
    .panel-title { font-size: 10px; font-weight: bold; color: #00ffcc; text-transform: uppercase; margin-bottom: 2px; }
    
    .row-group { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: rgba(255,255,255,0.03); padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08); }
    .row-group label { font-weight: bold; color: #ddd; flex: 1; }

    .btn-toggle {
      background: rgba(255, 51, 102, 0.2); color: #ff3366; border: 1px solid #ff3366;
      padding: 3px 8px; font-size: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    .btn-toggle.active { background: rgba(0, 255, 204, 0.2); color: #00ffcc; border-color: #00ffcc; }

    .file-btn {
      background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);
      padding: 3px 6px; font-size: 10px; border-radius: 4px; cursor: pointer; text-align: center;
    }
    .file-btn:hover { background: rgba(0, 255, 204, 0.2); border-color: #00ffcc; color: #00ffcc; }
    .file-input { display: none; }
    .file-name { font-size: 9px; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 90px; }

    .slider-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 10px; }
    .slider-row input { flex: 1; accent-color: #00ffcc; }

    /* Butoane Sus Dreapta */
    .top-right-btns { position: absolute; top: 15px; right: 15px; z-index: 30; display: flex; gap: 8px; }
    .action-btn {
      background: rgba(0, 255, 204, 0.2); color: #00ffcc; border: 1px solid #00ffcc;
      padding: 8px 14px; font-size: 11px; border-radius: 8px; cursor: pointer; font-weight: bold;
      backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .action-btn:hover { background: rgba(0, 255, 204, 0.4); }
    #recBtn.recording { background: rgba(255, 0, 0, 0.8); border-color: red; color: #fff; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    #status {
      position: absolute; bottom: 15px; left: 15px; z-index: 10;
      background: rgba(10, 10, 20, 0.8); padding: 5px 10px; border-radius: 6px;
      font-size: 10px; color: #00ffcc; border: 1px solid rgba(0,255,204,0.3);
    }
  </style>
</head>
<body>

<div id="app-container">
  <div class="top-right-btns">
    <button id="recBtn" class="action-btn">⏺ REC (MP4)</button>
    <button id="fullscreenBtn" class="action-btn">🔲 Fullscreen</button>
    <button id="hideControlsBtn" class="action-btn">👁 Hide Controls</button>
  </div>

  <!-- Panou Stânga -->
  <div id="control-panel">
    <div style="font-size: 11px; font-weight: bold; color: #00ffcc;">VTuber Studio v2.5 Control Panel</div>

    <div class="panel-section">
      <div class="panel-title">Comutatoare Generale</div>
      <div style="display: flex; gap: 6px;">
        <button id="toggleGrid" class="btn-toggle active">Linii Grid: ON</button>
        <button id="toggleAiCut" class="btn-toggle">Crop AI: ON</button>
        <button id="toggleCam" class="btn-toggle active">Camera: SHOW</button>
      </div>
      <button id="resetGrid" class="file-btn" style="border-color: #ff3366; color: #ff3366; margin-top: 4px;">Reset Formă Puncte</button>
    </div>

    <!-- ÎNCĂRCARE MĂȘTI & SEGMENTE -->
    <div class="panel-section">
      <div class="panel-title">Încărcare Măști & Segmente (Foto / Video)</div>
      
      <div class="row-group">
        <label>Cap: <span id="capStatus" style="color:#ff3366">OFF</span></label>
        <label class="file-btn">Choose File <input type="file" id="capInput" accept="image/*" class="file-input"></label>
        <span class="file-name" id="capFileName">No file chosen</span>
      </div>

      <div class="row-group">
        <label>Torso: <span id="torsoStatus" style="color:#ff3366">OFF</span></label>
        <label class="file-btn">Choose File <input type="file" id="torsoInput" accept="video/*,image/*" class="file-input"></label>
        <span class="file-name" id="torsoFileName">No file chosen</span>
      </div>

      <div class="row-group">
        <label>Braț L: <span id="armLStatus" style="color:#ff3366">OFF</span></label>
        <label class="file-btn">Choose File <input type="file" id="armLInput" accept="image/*" class="file-input"></label>
        <span class="file-name" id="armLFileName">No file chosen</span>
      </div>

      <div class="row-group">
        <label>Braț R: <span id="armRStatus" style="color:#ff3366">OFF</span></label>
        <label class="file-btn">Choose File <input type="file" id="armRInput" accept="image/*" class="file-input"></label>
        <span class="file-name" id="armRFileName">No file chosen</span>
      </div>
    </div>

    <!-- CALIBRARE MANUALĂ CAP & BRAȚE -->
    <div class="panel-section">
      <div class="panel-title">Calibrare Manuală Cap & Brațe</div>
      <div class="slider-row"><label>Scală Cap:</label><input type="range" id="scaleCap" min="0.1" max="3" step="0.05" value="1"></div>
      <div class="slider-row"><label>Grosime Brațe:</label><input type="range" id="thicknessArms" min="2" max="30" step="1" value="10"></div>
    </div>

    <!-- FUNDAL CUSTOM -->
    <div class="panel-section">
      <div class="panel-title">Fundal Custom (Foto / Video)</div>
      <div class="row-group">
        <button id="toggleBg" class="btn-toggle">Fundal: OFF</button>
        <label class="file-btn">Choose File <input type="file" id="bgInput" accept="image/*,video/*" class="file-input"></label>
        <span class="file-name" id="bgFileName">No file chosen</span>
      </div>
    </div>
  </div>

  <div id="status">Sistem pregătit...</div>
  <canvas id="canvas"></canvas>
</div>

<video id="webcam" playsinline muted></video>
<video id="torsoVid" loop muted playsinline crossorigin="anonymous"></video>
<video id="bgVid" loop muted playsinline crossorigin="anonymous"></video>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const webcamElem = document.getElementById('webcam');
  const torsoVidElem = document.getElementById('torsoVid');
  const bgVidElem = document.getElementById('bgVid');

  const capImg = new Image();
  const armLImg = new Image();
  const armRImg = new Image();
  const bgImg = new Image();

  let showGrid = true;
  let isAiCutOn = false;
  let showCamera = true;
  let useCap = false;
  let useTorso = false;
  let useArmL = false;
  let useArmR = false;
  let useBg = false;

  let currentTorsoMedia = null;
  let currentBgMedia = null;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Control UI Hide/Show
  const controlPanel = document.getElementById('control-panel');
  document.getElementById('hideControlsBtn').addEventListener('click', () => {
    controlPanel.classList.toggle('hidden');
    document.getElementById('hideControlsBtn').innerText = controlPanel.classList.contains('hidden') ? '👁 Show' : '👁 Hide Controls';
  });

  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else if (document.exitFullscreen) document.exitFullscreen();
  });

  document.getElementById('toggleGrid').addEventListener('click', (e) => {
    showGrid = !showGrid;
    e.target.innerText = `Linii Grid: ${showGrid ? 'ON' : 'OFF'}`;
    e.target.classList.toggle('active', showGrid);
  });

  document.getElementById('toggleAiCut').addEventListener('click', (e) => {
    isAiCutOn = !isAiCutOn;
    e.target.innerText = `Crop AI: ${isAiCutOn ? 'ON' : 'OFF'}`;
    e.target.classList.toggle('active', isAiCutOn);
  });

  document.getElementById('toggleCam').addEventListener('click', (e) => {
    showCamera = !showCamera;
    e.target.innerText = `Camera: ${showCamera ? 'SHOW' : 'HIDE'}`;
    e.target.classList.toggle('active', showCamera);
  });

  // Înregistrare Video MP4 cu Auto-Download
  let mediaRecorder, recordedChunks = [], isRecording = false;
  const recBtn = document.getElementById('recBtn');
  recBtn.addEventListener('click', () => {
    if (!isRecording) {
      recordedChunks = [];
      const stream = canvas.captureStream(30);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `VTuber_Studio_${Date.now()}.mp4`;
        document.body.appendChild(a); a.click();
        setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
      };
      mediaRecorder.start();
      isRecording = true;
      recBtn.classList.add('recording');
      recBtn.innerText = '⏹ STOP REC';
    } else {
      mediaRecorder.stop();
      isRecording = false;
      recBtn.classList.remove('recording');
      recBtn.innerText = '⏺ REC (MP4)';
    }
  });

  // Gestionare Fișiere
  function setupFileHandler(inputId, statusId, nameId, callback) {
    const input = document.getElementById(inputId);
    const status = document.getElementById(statusId);
    const nameSpan = document.getElementById(nameId);

    input.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      nameSpan.innerText = file.name;
      const url = URL.createObjectURL(file);
      callback(url, file.type);
      status.innerText = 'ON';
      status.style.color = '#00ffcc';
    });
  }

  setupFileHandler('capInput', 'capStatus', 'capFileName', (url) => { capImg.src = url; useCap = true; });
  setupFileHandler('torsoInput', 'torsoStatus', 'torsoFileName', (url, type) => {
    if (type.startsWith('video')) {
      torsoVidElem.src = url; torsoVidElem.play();
      currentTorsoMedia = torsoVidElem;
    } else {
      const img = new Image(); img.onload = () => { currentTorsoMedia = img; }; img.src = url;
    }
    useTorso = true;
  });
  setupFileHandler('armLInput', 'armLStatus', 'armLFileName', (url) => { armLImg.src = url; useArmL = true; });
  setupFileHandler('armRInput', 'armRStatus', 'armRFileName', (url) => { armRImg.src = url; useArmR = true; });
  setupFileHandler('bgInput', 'bgStatus', 'bgFileName', (url, type) => {
    if (type.startsWith('video')) {
      bgVidElem.src = url; bgVidElem.play();
      currentBgMedia = bgVidElem;
    } else {
      bgImg.onload = () => { currentBgMedia = bgImg; }; bgImg.src = url;
    }
    useBg = true;
  });

  // MAPPING 8 PUNCTE TORSO (Poate fi mutat oriunde cu mouse/touch)
  function getDefaultPoints() {
    const w = canvas.width; const h = canvas.height;
    return [
      { x: w * 0.35, y: h * 0.35 }, { x: w * 0.50, y: h * 0.33 }, { x: w * 0.65, y: h * 0.35 },
      { x: w * 0.35, y: h * 0.60 }, { x: w * 0.65, y: h * 0.60 },
      { x: w * 0.32, y: h * 0.85 }, { x: w * 0.50, y: h * 0.88 }, { x: w * 0.68, y: h * 0.85 }
    ];
  }

  let pts = JSON.parse(localStorage.getItem('v40_torso_8pts')) || getDefaultPoints();
  function saveConfig() { localStorage.setItem('v40_torso_8pts', JSON.stringify(pts)); }

  document.getElementById('resetGrid').addEventListener('click', () => { pts = getDefaultPoints(); saveConfig(); });

  let dragPtIndex = -1, isDraggingWholeFrame = false, lastMouse = { x: 0, y: 0 };
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function isPointInsidePolygon(p, vs) {
    let x = p.x, y = p.y, inside = false;
    for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
      let xi = vs[i].x, yi = vs[i].y, xj = vs[j].x, yj = vs[j].y;
      let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  canvas.addEventListener('mousedown', (e) => {
    const pos = getPos(e);
    dragPtIndex = -1; isDraggingWholeFrame = false;
    if (showGrid) {
      for (let i = 0; i < pts.length; i++) {
        if (Math.hypot(pts[i].x - pos.x, pts[i].y - pos.y) < 30) { dragPtIndex = i; break; }
      }
    }
    const outerPoly = [pts[0], pts[1], pts[2], pts[4], pts[7], pts[6], pts[5], pts[3]];
    if (dragPtIndex === -1 && isPointInsidePolygon(pos, outerPoly)) isDraggingWholeFrame = true;
    lastMouse = pos;
  });

  window.addEventListener('mousemove', (e) => {
    if (dragPtIndex === -1 && !isDraggingWholeFrame) return;
    const pos = getPos(e);
    const dx = pos.x - lastMouse.x; const dy = pos.y - lastMouse.y;
    if (dragPtIndex !== -1) { pts[dragPtIndex].x = pos.x; pts[dragPtIndex].y = pos.y; }
    else if (isDraggingWholeFrame) { pts.forEach(p => { p.x += dx; p.y += dy; }); }
    lastMouse = pos; saveConfig();
  });

  window.addEventListener('mouseup', () => { dragPtIndex = -1; isDraggingWholeFrame = false; });
  canvas.addEventListener('touchstart', (e) => { const pos = getPos(e); });

  function drawTriangleUV(media, p0, p1, p2, u0, v0, u1, v1, u2, v2) {
    const w = media.videoWidth || media.width || 1;
    const h = media.videoHeight || media.height || 1;
    ctx.save(); ctx.beginPath();
    ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
    ctx.closePath(); ctx.clip();

    const x0 = p0.x, y0 = p0.y, x1 = p1.x, y1 = p1.y, x2 = p2.x, y2 = p2.y;
    const sx0 = u0 * w, sy0 = v0 * h, sx1 = u1 * w, sy1 = v1 * h, sx2 = u2 * w, sy2 = v2 * h;
    const denom = (sx0 * (sy1 - sy2) + sx1 * (sy2 - sy0) + sx2 * (sy0 - sy1));
    if (Math.abs(denom) < 1e-5) { ctx.restore(); return; }

    const a = (x0 * (sy1 - sy2) + x1 * (sy2 - sy0) + x2 * (sy0 - sy1)) / denom;
    const c = (x0 * (sx2 - sx1) + x1 * (sx0 - sx2) + x2 * (sx1 - sx0)) / denom;
    const e = (x0 * (sx1 * sy2 - sx2 * sy1) + x1 * (sx2 * sy0 - sx0 * sy2) + x2 * (sx0 * sy1 - sx1 * sy0)) / denom;
    const b = (y0 * (sy1 - sy2) + y1 * (sy2 - sy0) + y2 * (sy0 - sy1)) / denom;
    const d = (y0 * (sx2 - sx1) + y1 * (sx0 - sx2) + y2 * (sx1 - sx0)) / denom;
    const f = (y0 * (sx1 * sy2 - sx2 * sy1) + y1 * (sx2 * sy0 - sx0 * sy2) + y2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    ctx.transform(a, b, c, d, e, f);
    ctx.drawImage(media, 0, 0, w, h);
    ctx.restore();
  }

  function renderTorso8Points(media) {
    const [p0, p1, p2, p3, p4, p5, p6, p7] = pts;
    const center = { x: ((p1.x + p6.x)/2 + (p3.x + p4.x)/2)/2, y: ((p1.y + p6.y)/2 + (p3.y + p4.y)/2)/2 };
    drawTriangleUV(media, p0, p1, center, 0, 0, 0.5, 0, 0.5, 0.5);
    drawTriangleUV(media, p0, center, p3, 0, 0, 0.5, 0.5, 0, 0.5);
    drawTriangleUV(media, p1, p2, center, 0.5, 0, 1, 0, 0.5, 0.5);
    drawTriangleUV(media, p2, p4, center, 1, 0, 1, 0.5, 0.5, 0.5);
    drawTriangleUV(media, center, p4, p7, 0.5, 0.5, 1, 0.5, 1, 1);
    drawTriangleUV(media, center, p7, p6, 0.5, 0.5, 1, 1, 0.5, 1);
    drawTriangleUV(media, center, p3, p5, 0, 0.5, 0.5, 0.5, 0, 1);
    drawTriangleUV(media, center, p6, p5, 0.5, 0.5, 0.5, 1, 0, 1);
  }

  let latestPoseResults = null, latestFaceResults = null, latestSegmentationResults = null;
  const pose = new Pose({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
  pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });
  pose.onResults(r => latestPoseResults = r);

  const faceMesh = new FaceMesh({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
  faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });
  faceMesh.onResults(r => latestFaceResults = r);

  const selfieSegmentation = new SelfieSegmentation({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}` });
  selfieSegmentation.setOptions({ modelSelection: 1 });
  selfieSegmentation.onResults(r => latestSegmentationResults = r);

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const w = canvas.width; const h = canvas.height;

    // 1. Fundal Custom
    if (useBg && currentBgMedia && (currentBgMedia === bgImg || currentBgMedia.readyState >= 2)) {
      ctx.drawImage(currentBgMedia, 0, 0, w, h);
    }

    // 2. Camera Reală & AI Crop
    if (showCamera && webcamElem.readyState >= 2) {
      if (isAiCutOn && latestSegmentationResults) {
        ctx.save();
        ctx.drawImage(latestSegmentationResults.segmentationMask, 0, 0, w, h);
        ctx.globalCompositeOperation = 'source-in';
        ctx.drawImage(webcamElem, 0, 0, w, h);
        ctx.restore();
      } else {
        ctx.drawImage(webcamElem, 0, 0, w, h);
      }
    }

    // 3. Brațe, Degete și Torso (Cu grosime ajustabilă și imagini custom opționale)
    if (latestPoseResults && latestPoseResults.poseLandmarks) {
      const lm = latestPoseResults.poseLandmarks;
      const tSize = parseInt(document.getElementById('thicknessArms').value);

      ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = tSize; ctx.lineCap = 'round';
      const links = [[11, 13], [13, 15], [12, 14], [14, 16], [11, 12], [23, 24], [15, 17], [16, 22]]; // Inclusiv degete/palme
      links.forEach(([i, j]) => {
        if (lm[i] && lm[j] && lm[i].visibility > 0.3 && lm[j].visibility > 0.3) {
          ctx.beginPath(); ctx.moveTo(lm[i].x * w, lm[i].y * h); ctx.lineTo(lm[j].x * w, lm[j].y * h); ctx.stroke();
        }
      });
    }

    // 4. Mască Cap (PNG)
    if (useCap && latestFaceResults && latestFaceResults.multiFaceLandmarks.length > 0) {
      const nose = latestFaceResults.multiFaceLandmarks[0][1];
      const scale = parseFloat(document.getElementById('scaleCap').value);
      ctx.save();
      ctx.translate(nose.x * w, nose.y * h);
      ctx.drawImage(capImg, -(capImg.width * scale)/2, -(capImg.height * scale)/2, capImg.width * scale, capImg.height * scale);
      ctx.restore();
    }

    // 5. TORSO MAPPING (Deasupra ta, mutat unde vrei prin 8 puncte)
    if (useTorso && currentTorsoMedia && (currentTorsoMedia.readyState >= 2 || currentTorsoMedia.width)) {
      renderTorso8Points(currentTorsoMedia);
    }

    // 6. Grid 8 Puncte
    if (showGrid) {
      const [p0, p1, p2, p3, p4, p5, p6, p7] = pts;
      ctx.strokeStyle = 'rgba(0, 255, 204, 0.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p4.x, p4.y); ctx.lineTo(p7.x, p7.y); ctx.lineTo(p6.x, p6.y);
      ctx.lineTo(p5.x, p5.y); ctx.lineTo(p3.x, p3.y); ctx.closePath(); ctx.stroke();

      pts.forEach((p, idx) => {
        ctx.fillStyle = (idx === 1 || idx === 6) ? '#ff0055' : '#00ffcc';
        ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.stroke();
      });
    }

    requestAnimationFrame(render);
  }

  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
      webcamElem.srcObject = stream; await webcamElem.play();
      const camera = new window.Camera(webcamElem, {
        onFrame: async () => {
          if (isAiCutOn) await selfieSegmentation.send({ image: webcamElem });
          await pose.send({ image: webcamElem });
          if (useCap) await faceMesh.send({ image: webcamElem });
        },
        width: 640, height: 480
      });
      camera.start(); render();
    } catch (err) {
      document.getElementById('status').innerText = "Eroare cameră!"; render();
    }
  }

  window.addEventListener('DOMContentLoaded', initCamera);
</script>
</body>
</html>
