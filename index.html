<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Versiunea 1.3: Crop AI Funcțional, Fundal Foto + Video, PNG Overlay & Tracking -->
  <title>Tracking & Multi-Layer System - v1.3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #08080c;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam, #output_canvas, #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
    #webcam, #bg-video {
      display: none; /* Elementele video brute sunt ascunse */
    }
    #output_canvas {
      z-index: 2;
      transform: scaleX(-1); /* Oglindire camera */
    }

    /* Panou Control */
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 320px;
      max-height: 92vh;
      overflow-y: auto;
      background: rgba(15, 15, 25, 0.9);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .btn-main {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      border: none;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-main:hover {
      transform: scale(1.02);
    }

    .btn-secondary {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 10px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: rgba(0, 255, 204, 0.2);
      border-color: #00ffcc;
    }

    .upload-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }
    .upload-group label {
      color: #00ffcc;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .file-input {
      color: #ccc;
      font-size: 12px;
    }

    .scale-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 12px;
    }
    .scale-controls input[type="range"] {
      flex: 1;
    }

    #status {
      color: #00ffcc;
      font-size: 12px;
      font-weight: bold;
    }
    #version-tag {
      position: absolute;
      bottom: 15px;
      right: 15px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      z-index: 10;
    }
  </style>

  <!-- MediaPipe Holistic & CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="container">
  <div id="ui-overlay">
    <button id="start-btn" class="btn-main">▶️ Pornire Sistem v1.3</button>
    <div id="status">Apasă pe buton pentru inițializare...</div>

    <div style="display: flex; gap: 6px;">
      <button id="toggle-crop-btn" class="btn-secondary">✂️ Crop AI: ON</button>
      <button id="fullscreen-btn" class="btn-secondary">⛶ Fullscreen</button>
    </div>

    <!-- Grupa 1: Upload Fundal Foto SAU Video -->
    <div class="upload-group">
      <label>1. Fundal Custom (Foto sau Video)</label>
      <input type="file" id="bg-file-upload" accept="image/*,video/*" class="file-input">
      <button id="clear-bg-btn" class="btn-secondary" style="margin-top:4px;">Șterge Fundal Custom</button>
    </div>

    <!-- Grupa 2: Upload Overlap PNG (Scalabil peste mâini/corp) -->
    <div class="upload-group">
      <label>2. Upload Overlap PNG</label>
      <input type="file" id="png-upload" accept="image/png" class="file-input">
      <div class="scale-controls">
        <span>Scală PNG:</span>
        <input type="range" id="png-scale" min="0.2" max="4.0" step="0.1" value="1.0">
      </div>
    </div>

    <!-- Grupa 3: Upload Model 3D (.GLB/.GLTF) -->
    <div class="upload-group">
      <label>3. Upload Model 3D (.GLB / .GLTF)</label>
      <input type="file" id="glb-upload" accept=".glb,.gltf" class="file-input">
      <div class="scale-controls">
        <span>Scală Cap:</span>
        <input type="range" id="head-scale" min="0.5" max="3.0" step="0.1" value="1.0">
      </div>
    </div>
  </div>

  <div id="version-tag">Versiunea 1.3</div>

  <video id="webcam" autoplay playsinline muted></video>
  <video id="bg-video" autoplay loop muted playsinline></video>
  <canvas id="output_canvas"></canvas>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const bgVideoElement = document.getElementById('bg-video');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');
  
  // Canvas auxiliar pentru masca AI Crop
  const maskCanvas = document.createElement('canvas');
  const maskCtx = maskCanvas.getContext('2d');

  const startBtn = document.getElementById('start-btn');
  const toggleCropBtn = document.getElementById('toggle-crop-btn');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const statusDiv = document.getElementById('status');
  const container = document.getElementById('container');

  // Input-uri
  const bgFileUpload = document.getElementById('bg-file-upload');
  const clearBgBtn = document.getElementById('clear-bg-btn');
  const pngUpload = document.getElementById('png-upload');
  const headScaleInput = document.getElementById('head-scale');
  const pngScaleInput = document.getElementById('png-scale');

  let camera = null;
  let enableCrop = true;

  // Stare resurse fundal
  let bgType = 'none'; // 'image', 'video', 'none'
  let customBgImg = null;
  let customPngImg = null;

  let headScaleFactor = 1.0;
  let pngScaleFactor = 1.0;

  function resizeCanvas() {
    canvasElement.width = window.innerWidth;
    canvasElement.height = window.innerHeight;
    maskCanvas.width = window.innerWidth;
    maskCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Încărcare Fundal (Foto sau Video)
  bgFileUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (file.type.startsWith('image/')) {
      bgType = 'image';
      bgVideoElement.pause();
      const img = new Image();
      img.onload = () => { customBgImg = img; };
      img.src = URL.createObjectURL(file);
      statusDiv.innerText = "Fundal FOTO încărcat!";
    } else if (file.type.startsWith('video/')) {
      bgType = 'video';
      bgVideoElement.src = URL.createObjectURL(file);
      bgVideoElement.play();
      statusDiv.innerText = "Fundal VIDEO încărcat!";
    }
  });

  clearBgBtn.addEventListener('click', () => {
    bgType = 'none';
    customBgImg = null;
    bgVideoElement.pause();
    bgFileUpload.value = '';
    statusDiv.innerText = "Fundal restabilit la implicit.";
  });

  // Încărcare PNG Overlay
  pngUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const img = new Image();
      img.onload = () => { customPngImg = img; };
      img.src = URL.createObjectURL(file);
    }
  });

  headScaleInput.addEventListener('input', (e) => { headScaleFactor = parseFloat(e.target.value); });
  pngScaleInput.addEventListener('input', (e) => { pngScaleFactor = parseFloat(e.target.value); });

  // Toggle Crop AI
  toggleCropBtn.addEventListener('click', () => {
    enableCrop = !enableCrop;
    toggleCropBtn.innerText = `✂️ Crop AI: ${enableCrop ? 'ON' : 'OFF'}`;
    statusDiv.innerText = `Crop AI este acum ${enableCrop ? 'ACTIV' : 'INACTIV'}`;
  });

  // Fullscreen
  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      container.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });

  // Configurare MediaPipe Holistic
  const holistic = new Holistic({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
  });

  holistic.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: true,
    smoothSegmentation: true,
    refineFaceLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  holistic.onResults((results) => {
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);

    // 1. PROCESARE DECUPARE FUNDAL (CROP AI + FUNDAL CUSTOM FOTO/VIDEO)
    if (enableCrop && results.segmentationMask) {
      // Pregătim masca pe canvas-ul secundar
      maskCtx.save();
      maskCtx.clearRect(0, 0, w, h);
      maskCtx.drawImage(results.segmentationMask, 0, 0, w, h);
      
      // Extragere persoană din cadru
      maskCtx.globalCompositeOperation = 'source-in';
      maskCtx.drawImage(results.image, 0, 0, w, h);
      maskCtx.restore();

      // Desenare Fundal dorit în Canvas-ul principal
      if (bgType === 'image' && customBgImg) {
        canvasCtx.drawImage(customBgImg, 0, 0, w, h);
      } else if (bgType === 'video' && bgVideoElement.readyState >= 2) {
        canvasCtx.drawImage(bgVideoElement, 0, 0, w, h);
      } else {
        // Fundal implicit întunecat
        canvasCtx.fillStyle = '#0a0a10';
        canvasCtx.fillRect(0, 0, w, h);
      }

      // Suprapunem persoana decupată peste fundal
      canvasCtx.drawImage(maskCanvas, 0, 0, w, h);
    } else {
      // Daca Crop AI este OFF, afisam direct cadrul brut din camera
      canvasCtx.drawImage(results.image, 0, 0, w, h);
    }

    // 2. MAPARE BUST, CAP SCALABIL ȘI BRAȚE
    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const pts = {
        nose:          { x: lm[0].x * w,  y: lm[0].y * h },
        leftShoulder:  { x: lm[11].x * w, y: lm[11].y * h },
        rightShoulder: { x: lm[12].x * w, y: lm[12].y * h },
        leftElbow:     { x: lm[13].x * w, y: lm[13].y * h },
        rightElbow:    { x: lm[14].x * w, y: lm[14].y * h },
        leftWrist:     { x: lm[15].x * w, y: lm[15].y * h },
        rightWrist:    { x: lm[16].x * w, y: lm[16].y * h },
        leftHip:       { x: lm[23].x * w, y: lm[23].y * h },
        rightHip:      { x: lm[24].x * w, y: lm[24].y * h }
      };

      const shoulderWidth = Math.hypot(pts.rightShoulder.x - pts.leftShoulder.x, pts.rightShoulder.y - pts.leftShoulder.y);

      // Forma Bustului
      canvasCtx.beginPath();
      canvasCtx.moveTo(pts.leftShoulder.x, pts.leftShoulder.y);
      canvasCtx.lineTo(pts.rightShoulder.x, pts.rightShoulder.y);
      canvasCtx.lineTo(pts.rightHip.x, pts.rightHip.y);
      canvasCtx.lineTo(pts.leftHip.x, pts.leftHip.y);
      canvasCtx.closePath();
      canvasCtx.fillStyle = 'rgba(0, 255, 204, 0.2)';
      canvasCtx.fill();
      canvasCtx.strokeStyle = '#00ffcc';
      canvasCtx.lineWidth = 3;
      canvasCtx.stroke();

      // Cap / Față Scalabilă
      const headRadius = (shoulderWidth * 0.35) * headScaleFactor;
      canvasCtx.beginPath();
      canvasCtx.arc(pts.nose.x, pts.nose.y, headRadius, 0, 2 * Math.PI);
      canvasCtx.strokeStyle = '#00f2fe';
      canvasCtx.lineWidth = 3;
      canvasCtx.stroke();

      // Brațe
      const arms = [
        [pts.leftShoulder, pts.leftElbow], [pts.leftElbow, pts.leftWrist],
        [pts.rightShoulder, pts.rightElbow], [pts.rightElbow, pts.rightWrist]
      ];
      canvasCtx.strokeStyle = '#ff0055';
      canvasCtx.lineWidth = 4;
      arms.forEach(([p1, p2]) => {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x, p1.y);
        canvasCtx.lineTo(p2.x, p2.y);
        canvasCtx.stroke();
      });

      // 3. DESENARE OVERLAP PNG PESTE MÂINI / CORP
      if (customPngImg) {
        const pngW = 180 * pngScaleFactor;
        const pngH = (customPngImg.height / customPngImg.width) * pngW;
        // Plasat automat pe încheietura mâinii drepte (sau poziție ajustabilă)
        canvasCtx.drawImage(customPngImg, pts.rightWrist.x - pngW / 2, pts.rightWrist.y - pngH / 2, pngW, pngH);
      }

      // Puncte Articulații
      Object.values(pts).forEach((p) => {
        canvasCtx.beginPath();
        canvasCtx.arc(p.x, p.y, 8, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#ffff00';
        canvasCtx.fill();
        canvasCtx.strokeStyle = '#000';
        canvasCtx.stroke();
      });
    }

    // 4. MAPARE MÂINI (LEFT & RIGHT)
    if (results.leftHandLandmarks) {
      drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 2 });
      drawLandmarks(canvasCtx, results.leftHandLandmarks, { color: '#ff00ff', radius: 3 });
    }
    if (results.rightHandLandmarks) {
      drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 2 });
      drawLandmarks(canvasCtx, results.rightHandLandmarks, { color: '#ff00ff', radius: 3 });
    }

    canvasCtx.restore();
  });

  // Pornire Aplicație
  startBtn.addEventListener('click', async () => {
    statusDiv.innerText = "Se inițializează camera...";
    startBtn.style.display = 'none';

    if (!camera) {
      camera = new Camera(videoElement, {
        onFrame: async () => {
          await holistic.send({ image: videoElement });
        },
        width: 1280,
        height: 720
      });
      await camera.start();
      statusDiv.innerText = "v1.3 Activ • Crop AI & Tracking Funcționale!";
    }
  });
</script>

</body>
</html>
