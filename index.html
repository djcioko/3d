<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Full Screen Body & Hand Tracking</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    /* Elementele suprapuse perfect pe tot ecranul */
    #webcam, #output_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Oglindire camera */
    }
    #webcam {
      opacity: 0.4; /* Video semi-transparent */
      z-index: 1;
    }
    #output_canvas {
      z-index: 2; /* Canvas-ul peste video */
    }
    #loading {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ffcc;
      font-size: 20px;
      font-weight: bold;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 15px;
      border-radius: 8px;
    }
  </style>

  <!-- Librării MediaPipe de pe CDN stabil -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="container">
  <div id="loading">Pornire cameră și încărcare plasă tracking...</div>
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="output_canvas"></canvas>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const loadingDiv = document.getElementById('loading');

  // Ajustează rezoluția internă a canvas-ului la dimensiunile reale ale ferestrei
  function fitCanvasToWindow() {
    canvasElement.width = window.innerWidth;
    canvasElement.height = window.innerHeight;
  }
  window.addEventListener('resize', fitCanvasToWindow);
  fitCanvasToWindow();

  // Configurare MediaPipe Holistic
  const holistic = new Holistic({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
  });

  holistic.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    refineFaceLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  // Procesare cadru și desenare plasă pe ecran
  holistic.onResults((results) => {
    if (loadingDiv.style.display !== 'none') {
      loadingDiv.style.display = 'none';
    }

    // Păstrăm dimensiunile sincronizate
    if (canvasElement.width !== window.innerWidth || canvasElement.height !== window.innerHeight) {
      fitCanvasToWindow();
    }

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    // Scaling manual pentru ca plasa să se potrivească exact cu opțiunea "object-fit: cover" a camerei
    const videoWidth = videoElement.videoWidth;
    const videoHeight = videoElement.videoHeight;

    if (videoWidth && videoHeight) {
      // 1. Plasa Corp (Pose Mesh)
      if (results.poseLandmarks) {
        drawConnectors(canvasCtx, results.poseLandmarks, HOLISTIC_CONNECTIONS, {
          color: '#00FF00',
          lineWidth: 3
        });
        drawLandmarks(canvasCtx, results.poseLandmarks, {
          color: '#FF0000',
          lineWidth: 2,
          radius: 4
        });
      }

      // 2. Plasa Mâna Stângă
      if (results.leftHandLandmarks) {
        drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, {
          color: '#CC00FF',
          lineWidth: 3
        });
        drawLandmarks(canvasCtx, results.leftHandLandmarks, {
          color: '#00FFFF',
          radius: 4
        });
      }

      // 3. Plasa Mâna Dreaptă
      if (results.rightHandLandmarks) {
        drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, {
          color: '#00CCFF',
          lineWidth: 3
        });
        drawLandmarks(canvasCtx, results.rightHandLandmarks, {
          color: '#FF00FF',
          radius: 4
        });
      }

      // 4. Plasa Față (Face Mesh)
      if (results.faceLandmarks) {
        drawConnectors(canvasCtx, results.faceLandmarks, FACEMESH_TESSELATION, {
          color: '#C0C0C070',
          lineWidth: 1
        });
      }
    }

    canvasCtx.restore();
  });

  // Inițializare și pornire cameră Web
  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await holistic.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });

  camera.start();
</script>

</body>
</html>
