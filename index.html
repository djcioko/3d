<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Puppet Rigging - v2.2 Free-Form & Drag Adjustment</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #08080c;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam, #output_canvas, #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
    #webcam, #bg-video {
      display: none;
    }
    #output_canvas {
      z-index: 2;
      transform: scaleX(-1);
      cursor: crosshair;
    }

    /* Control Panel */
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 360px;
      max-height: 92vh;
      overflow-y: auto;
      background: rgba(15, 15, 25, 0.92);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .btn-main {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      border: none;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-main:hover {
      transform: scale(1.02);
    }

    .btn-toggle {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 5px 8px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      min-width: 65px;
      text-align: center;
    }
    .btn-toggle.active {
      background: rgba(0, 255, 204, 0.3);
      border-color: #00ffcc;
      color: #00ffcc;
      font-weight: bold;
    }

    .upload-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }
    .upload-group label {
      color: #00ffcc;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .file-input {
      color: #ccc;
      font-size: 11px;
      flex: 1;
    }

    .row-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scale-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 11px;
    }
    .scale-controls input[type="range"] {
      flex: 1;
    }

    #status {
      color: #00ffcc;
      font-size: 12px;
      font-weight: bold;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="container">
  <div id="ui-overlay">
    <button id="start-btn" class="btn-main">▶️️ Pornire Puppet Rig v2.2</button>
    <div id="status">Apasă pe buton pentru start...</div>

    <!-- Switchuri Globale Layer-e -->
    <div class="upload-group">
      <label>Comutatoare Generale</label>
      <div class="row-btns">
        <button id="toggle-skeleton" class="btn-toggle active">Linii Tracking: ON</button>
        <button id="toggle-crop" class="btn-toggle active">Crop AI: ON</button>
        <button id="reset-offsets" class="btn-toggle" style="border-color:#ff0055; color:#ff3366;">Reset Calibrare</button>
      </div>
    </div>

    <!-- Upload & ON/OFF pe Fiecare Fragment PNG -->
    <div class="upload-group">
      <label>Încărcare & Comutatoare Elemente PNG</label>
      
      <!-- 1. CAP -->
      <div class="item-row">
        <button id="tog-head" class="btn-toggle active">Cap: ON</button>
        <input type="file" id="png-head" accept="image/png,image/*" class="file-input">
      </div>

      <!-- 2. TORSO -->
      <div class="item-row">
        <button id="tog-torso" class="btn-toggle active">Torso: ON</button>
        <input type="file" id="png-torso" accept="image/png,image/*" class="file-input">
      </div>

      <!-- 3. BRAȚ STÂNG -->
      <div class="item-row">
        <button id="tog-arm-left" class="btn-toggle active">Braț L: ON</button>
        <input type="file" id="png-arm-left" accept="image/png,image/*" class="file-input">
      </div>

      <!-- 4. BRAȚ DREPT -->
      <div class="item-row">
        <button id="tog-arm-right" class="btn-toggle active">Braț R: ON</button>
        <input type="file" id="png-arm-right" accept="image/png,image/*" class="file-input">
      </div>
    </div>

    <!-- Ajustări Free-Form Mască / Cap -->
    <div class="upload-group">
      <label>Calibrare Free-Form Mască (Poziție & Scală)</label>
      <div class="scale-controls">
        <span>Scală:</span>
        <input type="range" id="scale-head" min="0.3" max="3.0" step="0.05" value="1.0">
      </div>
      <div class="scale-controls">
        <span>Ajustare Y (Sus / Jos):</span>
        <input type="range" id="offset-head-y" min="-150" max="150" step="2" value="0">
      </div>
      <div class="scale-controls">
        <span>Ajustare X (Stânga / Dreapta):</span>
        <input type="range" id="offset-head-x" min="-150" max="150" step="2" value="0">
      </div>
    </div>

    <!-- Scalare Corp -->
    <div class="upload-group">
      <label>Scalare Torso & Brațe</label>
      <div class="scale-controls">
        <span>Scală Torso:</span>
        <input type="range" id="scale-torso" min="0.5" max="3.0" step="0.1" value="1.0">
      </div>
      <div class="scale-controls">
        <span>Grosime Brațe:</span>
        <input type="range" id="scale-arms" min="0.5" max="3.0" step="0.1" value="1.0">
      </div>
    </div>

    <!-- Fundal -->
    <div class="upload-group">
      <label>Fundal Custom</label>
      <input type="file" id="bg-file-upload" accept="image/*,video/*" class="file-input">
    </div>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <video id="bg-video" autoplay loop muted playsinline></video>
  <canvas id="output_canvas"></canvas>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const bgVideoElement = document.getElementById('bg-video');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');

  const startBtn = document.getElementById('start-btn');
  const statusDiv = document.getElementById('status');
  const resetBtn = document.getElementById('reset-offsets');

  // Toggle BTNs Globale
  const toggleSkeletonBtn = document.getElementById('toggle-skeleton');
  const toggleCropBtn = document.getElementById('toggle-crop');

  // Toggle BTNs Individuale
  const togHeadBtn = document.getElementById('tog-head');
  const togTorsoBtn = document.getElementById('tog-torso');
  const togArmLeftBtn = document.getElementById('tog-arm-left');
  const togArmRightBtn = document.getElementById('tog-arm-right');

  // Inputs Fragmente
  const inputHead = document.getElementById('png-head');
  const inputTorso = document.getElementById('png-torso');
  const inputArmLeft = document.getElementById('png-arm-left');
  const inputArmRight = document.getElementById('png-arm-right');
  const bgFileUpload = document.getElementById('bg-file-upload');

  // Sliders Free-Form
  const sliderHead = document.getElementById('scale-head');
  const sliderHeadY = document.getElementById('offset-head-y');
  const sliderHeadX = document.getElementById('offset-head-x');
  const sliderTorso = document.getElementById('scale-torso');
  const sliderArms = document.getElementById('scale-arms');

  // Stări ON / OFF
  let showSkeleton = localStorage.getItem('app_showSkeleton') !== 'false';
  let enableCrop = localStorage.getItem('app_crop') !== 'false';

  const partVis = {
    head: localStorage.getItem('app_vis_head') !== 'false',
    torso: localStorage.getItem('app_vis_torso') !== 'false',
    armLeft: localStorage.getItem('app_vis_armLeft') !== 'false',
    armRight: localStorage.getItem('app_vis_armRight') !== 'false'
  };

  // Offsets Calibrare Umeri & Head (Ajustate prin Drag / Sliders)
  let shoulderOffsets = JSON.parse(localStorage.getItem('app_shoulder_offsets')) || {
    left: { x: 0, y: 0 },
    right: { x: 0, y: 0 }
  };

  let headOffsetY = parseFloat(localStorage.getItem('app_head_offset_y')) || 0;
  let headOffsetX = parseFloat(localStorage.getItem('app_head_offset_x')) || 0;

  sliderHeadY.value = headOffsetY;
  sliderHeadX.value = headOffsetX;

  let bgType = 'none';
  let customBgImg = null;

  const puppetImages = { head: null, torso: null, armLeft: null, armRight: null };
  const puppetScales = { head: 1.0, torso: 1.0, arms: 1.0 };

  const maskCanvas = document.createElement('canvas');
  const maskCtx = maskCanvas.getContext('2d');

  function resizeCanvas() {
    canvasElement.width = window.innerWidth;
    canvasElement.height = window.innerHeight;
    maskCanvas.width = window.innerWidth;
    maskCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Drag and Drop pe Canvas pentru Punctele Umerilor
  let draggingPoint = null; // 'leftShoulder' sau 'rightShoulder'
  let currentPoints = {};

  canvasElement.addEventListener('mousedown', (e) => {
    const rect = canvasElement.getBoundingClientRect();
    // Inversăm coordonata X deoarece canvas-ul este oglindit (scaleX(-1))
    const mouseX = rect.width - (e.clientX - rect.left);
    const mouseY = e.clientY - rect.top;

    if (currentPoints.leftShoulder && Math.hypot(mouseX - currentPoints.leftShoulder.x, mouseY - currentPoints.leftShoulder.y) < 25) {
      draggingPoint = 'leftShoulder';
    } else if (currentPoints.rightShoulder && Math.hypot(mouseX - currentPoints.rightShoulder.x, mouseY - currentPoints.rightShoulder.y) < 25) {
      draggingPoint = 'rightShoulder';
    }
  });

  canvasElement.addEventListener('mousemove', (e) => {
    if (!draggingPoint || !currentPoints.rawLeftShoulder) return;

    const rect = canvasElement.getBoundingClientRect();
    const mouseX = rect.width - (e.clientX - rect.left);
    const mouseY = e.clientY - rect.top;

    if (draggingPoint === 'leftShoulder') {
      shoulderOffsets.left.x = mouseX - currentPoints.rawLeftShoulder.x;
      shoulderOffsets.left.y = mouseY - currentPoints.rawLeftShoulder.y;
    } else if (draggingPoint === 'rightShoulder') {
      shoulderOffsets.right.x = mouseX - currentPoints.rawRightShoulder.x;
      shoulderOffsets.right.y = mouseY - currentPoints.rawRightShoulder.y;
    }

    localStorage.setItem('app_shoulder_offsets', JSON.stringify(shoulderOffsets));
  });

  window.addEventListener('mouseup', () => { draggingPoint = null; });

  // Reset Calibrare
  resetBtn.addEventListener('click', () => {
    shoulderOffsets = { left: { x: 0, y: 0 }, right: { x: 0, y: 0 } };
    headOffsetY = 0; headOffsetX = 0;
    sliderHeadY.value = 0; sliderHeadX.value = 0;
    localStorage.removeItem('app_shoulder_offsets');
    localStorage.removeItem('app_head_offset_y');
    localStorage.removeItem('app_head_offset_x');
    statusDiv.innerText = "Calibrare resatată!";
  });

  // Load / Save Handlers
  function saveImageToStorage(key, imgDataUrl) { try { localStorage.setItem(key, imgDataUrl); } catch(e){} }
  function loadImage(src, callback) { if(!src) return; const img = new Image(); img.onload = () => callback(img); img.src = src; }

  function handleFileInput(inputEl, storageKey, objKey) {
    inputEl.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const dataUrl = event.target.result;
          loadImage(dataUrl, (img) => { puppetImages[objKey] = img; });
          saveImageToStorage(storageKey, dataUrl);
          statusDiv.innerText = `Fragment ${objKey} încărcat!`;
        };
        reader.readAsDataURL(file);
      }
    });
  }

  handleFileInput(inputHead, 'app_png_head', 'head');
  handleFileInput(inputTorso, 'app_png_torso', 'torso');
  handleFileInput(inputArmLeft, 'app_png_arm_left', 'armLeft');
  handleFileInput(inputArmRight, 'app_png_arm_right', 'armRight');

  window.addEventListener('load', () => {
    ['head', 'torso', 'arm_left', 'arm_right'].forEach(part => {
      const saved = localStorage.getItem(`app_png_${part}`);
      const keyMap = { head: 'head', torso: 'torso', arm_left: 'armLeft', arm_right: 'armRight' };
      if (saved) loadImage(saved, (img) => { puppetImages[keyMap[part]] = img; });
    });

    updateBtnState(togHeadBtn, partVis.head, "Cap");
    updateBtnState(togTorsoBtn, partVis.torso, "Torso");
    updateBtnState(togArmLeftBtn, partVis.armLeft, "Braț L");
    updateBtnState(togArmRightBtn, partVis.armRight, "Braț R");
    updateBtnState(toggleSkeletonBtn, showSkeleton, "Linii Tracking");
    updateBtnState(toggleCropBtn, enableCrop, "Crop AI");
  });

  function updateBtnState(btn, state, label) {
    btn.classList.toggle('active', state);
    btn.innerText = `${label}: ${state ? 'ON' : 'OFF'}`;
  }

  function bindToggle(btn, key, label, isGlobal = false) {
    btn.addEventListener('click', () => {
      if (isGlobal) {
        if (key === 'skeleton') { showSkeleton = !showSkeleton; localStorage.setItem('app_showSkeleton', showSkeleton); updateBtnState(btn, showSkeleton, label); }
        if (key === 'crop') { enableCrop = !enableCrop; localStorage.setItem('app_crop', enableCrop); updateBtnState(btn, enableCrop, label); }
      } else {
        partVis[key] = !partVis[key];
        localStorage.setItem(`app_vis_${key}`, partVis[key]);
        updateBtnState(btn, partVis[key], label);
      }
    });
  }

  bindToggle(togHeadBtn, 'head', 'Cap');
  bindToggle(togTorsoBtn, 'torso', 'Torso');
  bindToggle(togArmLeftBtn, 'armLeft', 'Braț L');
  bindToggle(togArmRightBtn, 'armRight', 'Braț R');
  bindToggle(toggleSkeletonBtn, 'skeleton', 'Linii Tracking', true);
  bindToggle(toggleCropBtn, 'crop', 'Crop AI', true);

  sliderHead.addEventListener('input', (e) => puppetScales.head = parseFloat(e.target.value));
  sliderTorso.addEventListener('input', (e) => puppetScales.torso = parseFloat(e.target.value));
  sliderArms.addEventListener('input', (e) => puppetScales.arms = parseFloat(e.target.value));

  sliderHeadY.addEventListener('input', (e) => {
    headOffsetY = parseFloat(e.target.value);
    localStorage.setItem('app_head_offset_y', headOffsetY);
  });
  sliderHeadX.addEventListener('input', (e) => {
    headOffsetX = parseFloat(e.target.value);
    localStorage.setItem('app_head_offset_x', headOffsetX);
  });

  bgFileUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.type.startsWith('image/')) {
      bgType = 'image';
      bgVideoElement.pause();
      loadImage(URL.createObjectURL(file), (img) => customBgImg = img);
    } else if (file.type.startsWith('video/')) {
      bgType = 'video';
      bgVideoElement.src = URL.createObjectURL(file);
      bgVideoElement.play();
    }
  });

  function drawBoneSegment(ctx, img, p1, p2, scaleFactor = 1.0) {
    if (!img) return;
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const distance = Math.hypot(dx, dy);
    if (distance < 15) return;

    const angle = Math.atan2(dy, dx);
    ctx.save();
    ctx.translate(p1.x, p1.y);
    ctx.rotate(angle);
    const drawLength = distance;
    const drawWidth = (img.height * (drawLength / img.width)) * scaleFactor;
    ctx.drawImage(img, 0, -drawWidth / 2, drawLength, drawWidth);
    ctx.restore();
  }

  // MediaPipe Setup
  const holistic = new Holistic({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}` });
  holistic.setOptions({ modelComplexity: 1, smoothLandmarks: true, enableSegmentation: true, smoothSegmentation: true, refineFaceLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

  holistic.onResults((results) => {
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);

    // 1. FUNDAL & CROP AI
    if (enableCrop && results.segmentationMask) {
      maskCtx.save();
      maskCtx.clearRect(0, 0, w, h);
      maskCtx.drawImage(results.segmentationMask, 0, 0, w, h);
      maskCtx.globalCompositeOperation = 'source-in';
      maskCtx.drawImage(results.image, 0, 0, w, h);
      maskCtx.restore();

      if (bgType === 'image' && customBgImg) canvasCtx.drawImage(customBgImg, 0, 0, w, h);
      else if (bgType === 'video' && bgVideoElement.readyState >= 2) canvasCtx.drawImage(bgVideoElement, 0, 0, w, h);
      else { canvasCtx.fillStyle = '#0a0a10'; canvasCtx.fillRect(0, 0, w, h); }

      canvasCtx.drawImage(maskCanvas, 0, 0, w, h);
    } else {
      canvasCtx.drawImage(results.image, 0, 0, w, h);
    }

    // 2. TRACKING & CALIBRARE
    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const rawLeftShoulder = { x: lm[11].x * w, y: lm[11].y * h };
      const rawRightShoulder = { x: lm[12].x * w, y: lm[12].y * h };

      // Aplicăm Offsets Manuale setate cu Mouse-ul
      const pts = {
        nose:          { x: lm[0].x * w + headOffsetX,  y: lm[0].y * h + headOffsetY },
        leftShoulder:  { x: rawLeftShoulder.x + shoulderOffsets.left.x, y: rawLeftShoulder.y + shoulderOffsets.left.y },
        rightShoulder: { x: rawRightShoulder.x + shoulderOffsets.right.x, y: rawRightShoulder.y + shoulderOffsets.right.y },
        leftElbow:     { x: lm[13].x * w, y: lm[13].y * h },
        rightElbow:    { x: lm[14].x * w, y: lm[14].y * h },
        leftWrist:     { x: lm[15].x * w, y: lm[15].y * h },
        rightWrist:    { x: lm[16].x * w, y: lm[16].y * h },
        leftHip:       { x: lm[23].x * w, y: lm[23].y * h },
        rightHip:      { x: lm[24].x * w, y: lm[24].y * h }
      };

      currentPoints = {
        ...pts,
        rawLeftShoulder,
        rawRightShoulder
      };

      const shoulderWidth = Math.hypot(pts.rightShoulder.x - pts.leftShoulder.x, pts.rightShoulder.y - pts.leftShoulder.y);

      // --- RENDERE ELEMENTE PNG ---
      if (partVis.torso && puppetImages.torso) {
        const chestCenter = { x: (pts.leftShoulder.x + pts.rightShoulder.x)/2, y: (pts.leftShoulder.y + pts.leftHip.y)/2 };
        const torsoW = shoulderWidth * 1.6 * puppetScales.torso;
        const torsoH = (puppetImages.torso.height / puppetImages.torso.width) * torsoW;
        canvasCtx.drawImage(puppetImages.torso, chestCenter.x - torsoW/2, chestCenter.y - torsoH/2, torsoW, torsoH);
      }

      if (partVis.head && puppetImages.head) {
        const headW = shoulderWidth * 1.2 * puppetScales.head;
        const headH = (puppetImages.head.height / puppetImages.head.width) * headW;
        canvasCtx.drawImage(puppetImages.head, pts.nose.x - headW/2, pts.nose.y - headH/2, headW, headH);
      }

      if (partVis.armLeft && puppetImages.armLeft) drawBoneSegment(canvasCtx, puppetImages.armLeft, pts.leftShoulder, pts.leftElbow, puppetScales.arms);
      if (partVis.armRight && puppetImages.armRight) drawBoneSegment(canvasCtx, puppetImages.armRight, pts.rightShoulder, pts.rightElbow, puppetScales.arms);

      // --- SKELETON & DRAG HANDLES ---
      if (showSkeleton) {
        // Poligon Bust
        canvasCtx.beginPath();
        canvasCtx.moveTo(pts.leftShoulder.x, pts.leftShoulder.y);
        canvasCtx.lineTo(pts.rightShoulder.x, pts.rightShoulder.y);
        canvasCtx.lineTo(pts.rightHip.x, pts.rightHip.y);
        canvasCtx.lineTo(pts.leftHip.x, pts.leftHip.y);
        canvasCtx.closePath();
        canvasCtx.fillStyle = 'rgba(0, 255, 204, 0.15)';
        canvasCtx.fill();
        canvasCtx.strokeStyle = '#00ffcc';
        canvasCtx.lineWidth = 2;
        canvasCtx.stroke();

        // Cerc Cap
        canvasCtx.beginPath();
        canvasCtx.arc(pts.nose.x, pts.nose.y, shoulderWidth * 0.35, 0, 2 * Math.PI);
        canvasCtx.strokeStyle = '#00f2fe';
        canvasCtx.lineWidth = 2;
        canvasCtx.stroke();

        // Brațe
        const arms = [
          [pts.leftShoulder, pts.leftElbow], [pts.leftElbow, pts.leftWrist],
          [pts.rightShoulder, pts.rightElbow], [pts.rightElbow, pts.rightWrist]
        ];
        canvasCtx.strokeStyle = '#ff0055';
        canvasCtx.lineWidth = 3;
        arms.forEach(([p1, p2]) => {
          canvasCtx.beginPath();
          canvasCtx.moveTo(p1.x, p1.y);
          canvasCtx.lineTo(p2.x, p2.y);
          canvasCtx.stroke();
        });

        // Articulații Normale
        Object.values(pts).forEach((p) => {
          canvasCtx.beginPath();
          canvasCtx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
          canvasCtx.fillStyle = '#ffff00';
          canvasCtx.fill();
          canvasCtx.stroke();
        });

        // HIGHLIGHT SPECIAL PENTRU PUNCTELE MUTABILE DE PE UMERI (CLICK & DRAG)
        [pts.leftShoulder, pts.rightShoulder].forEach((p) => {
          canvasCtx.beginPath();
          canvasCtx.arc(p.x, p.y, 10, 0, 2 * Math.PI);
          canvasCtx.fillStyle = 'rgba(0, 255, 204, 0.6)';
          canvasCtx.strokeStyle = '#ffffff';
          canvasCtx.lineWidth = 2;
          canvasCtx.fill();
          canvasCtx.stroke();
        });
      }
    }

    if (showSkeleton) {
      if (results.leftHandLandmarks) drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 1.5 });
      if (results.rightHandLandmarks) drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 1.5 });
    }

    canvasCtx.restore();
  });

  // Start Camera
  startBtn.addEventListener('click', async () => {
    statusDiv.innerText = "Se pornește sistemul...";
    startBtn.style.display = 'none';
    let camera = new Camera(videoElement, {
      onFrame: async () => { await holistic.send({ image: videoElement }); },
      width: 1280,
      height: 720
    });
    await camera.start();
    statusDiv.innerText = "v2.2 Activ • Poți muta punctele de pe umeri cu Mouse-ul!";
  });
</script>
