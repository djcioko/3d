<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WebAR MoCap Hybrid v3 — 2D/3D Multi-Layer & Control Hide</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --bg: #0e1116;
    --panel: rgba(23, 28, 36, 0.92);
    --line: #2a3342;
    --text: #e8edf5;
    --muted: #93a0b5;
    --accent: #3ddc97;
    --danger: #ff5d73;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 100vh; }
  
  /* Când UI este ascuns */
  body.hide-ui { grid-template-columns: 1fr !important; }
  body.hide-ui #panel, body.hide-ui #hud { display: none !important; }
  
  #stage { position: relative; background: #000; overflow: hidden; }
  #video, #overlay, #three { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: cover; transform: scaleX(-1); }
  #overlay, #three { pointer-events: none; }
  
  #toggle-ui-floating {
    position: absolute; right: 12px; top: 12px; z-index: 100;
    background: rgba(0,0,0,0.7); color: var(--accent); border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold;
    backdrop-filter: blur(4px);
  }

  #hud {
    position: absolute; left: 12px; top: 12px; z-index: 5;
    background: rgba(8, 10, 14, 0.75); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; max-width: 400px; backdrop-filter: blur(8px);
  }
  #status { color: var(--accent); font-weight: 600; font-size: 13px; }
  #status.err { color: var(--danger); }

  #panel {
    background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 14px; z-index: 10; backdrop-filter: blur(10px);
  }
  h1 { font-size: 16px; margin: 0 0 6px; }
  h2 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .row label { flex: 1; color: var(--muted); font-size: 12px; }
  
  button, .filebtn {
    background: #222a36; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px;
  }
  button.on { background: #143628; border-color: #1f6b48; color: var(--accent); }
  button.primary { background: #145c40; border-color: #1f8a5b; color: white; width: 100%; }
  input[type="range"] { width: 120px; }
  
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 6px 0; background: #121820; }
  .card h3 { margin: 0 0 6px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>

  <button id="toggle-ui-floating" type="button">👁 Toggle UI (H)</button>

  <div id="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
    <canvas id="three"></canvas>
    
    <div id="hud">
      <div id="status">Se încarcă engine-ul Hybrid 2D/3D...</div>
    </div>
  </div>

  <aside id="panel">
    <h1>WebAR MoCap Studio</h1>
    <button id="btnCam" class="primary" type="button" style="margin-bottom: 10px;">▶ Pornește Camera</button>

    <h2>Setări Afișare</h2>
    <div class="row">
      <button id="btnMirror" class="on">Mirror</button>
      <button id="togSkel" class="on">Skeleton</button>
      <button id="tog3D" class="on">Render 3D</button>
    </div>

    <h2>Sloturi Membre (2D PNG sau 3D GLB)</h2>
    <div id="partCards"></div>

    <h2>Persistență Setări</h2>
    <div class="row">
      <button id="btnSave" class="primary" type="button">Salvează Setări</button>
      <button id="btnReset" type="button" style="width: 100%;">Reset</button>
    </div>
  </aside>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/vision_bundle.mjs";

const PARTS = [
  { id: "head", label: "Cap (Head)", lmIndex: 0 },
  { id: "torso", label: "Trunchi (Torso)", lmIndex: 11 },
  { id: "armL", label: "Braț Stâng", lmIndex: 11 },
  { id: "armR", label: "Braț Drept", lmIndex: 12 }
];

const settings = {
  mirror: true,
  showSkel: true,
  show3D: true,
  uiVisible: true,
  parts: {
    head: { scale: 1, ox: 0, oy: 0, enabled: true, type: 'none' },
    torso: { scale: 1, ox: 0, oy: 0, enabled: true, type: 'none' },
    armL: { scale: 1, ox: 0, oy: 0, enabled: true, type: 'none' },
    armR: { scale: 1, ox: 0, oy: 0, enabled: true, type: 'none' }
  }
};

const statusEl = document.getElementById("status");
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const octx = overlay.getContext("2d");
const threeCanvas = document.getElementById("three");
const stage = document.getElementById("stage");

let poseLandmarker = null;
let cameraOn = false;
let latestWorld = null;
let latestLm = null;

// IndexedDB Helper
function openDb() {
  return new Promise((res, rej) => {
    const req = indexedDB.open("webar-mocap-v3", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("assets");
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function saveAsset(key, blob) {
  const db = await openDb();
  const tx = db.transaction("assets", "readwrite");
  tx.objectStore("assets").put(blob, key);
}
async function getAsset(key) {
  const db = await openDb();
  return new Promise((res) => {
    const req = db.transaction("assets", "readonly").objectStore("assets").get(key);
    req.onsuccess = () => res(req.result);
  });
}

// Three.js Scene Setup
const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 0, 3);

// Lumini optimizate pentru GLB
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(1, 2, 3);
scene.add(dirLight);

const gltfLoader = new GLTFLoader();
const loadedModels = {};
const loadedImages = {};

function resize() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  overlay.width = w;
  overlay.height = h;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

// Toggle UI (Ascunde / Arată panoul)
function toggleUI() {
  settings.uiVisible = !settings.uiVisible;
  document.body.classList.toggle("hide-ui", !settings.uiVisible);
}
document.getElementById("toggle-ui-floating").addEventListener("click", toggleUI);
window.addEventListener("keydown", (e) => {
  if (e.key === 'h' || e.key === 'H') toggleUI();
});

// Încărcare Asset-uri (2D / 3D)
async function loadPartFile(partId, file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const buffer = await file.arrayBuffer();
  await saveAsset(partId, new Blob([buffer]));

  if (ext === 'glb' || ext === 'gltf') {
    gltfLoader.parse(buffer, '', (gltf) => {
      if (loadedModels[partId]) scene.remove(loadedModels[partId]);
      loadedModels[partId] = gltf.scene;
      scene.add(gltf.scene);
      settings.parts[partId].type = '3d';
      statusEl.textContent = `Model 3D încărcat pentru ${partId}`;
    });
  } else {
    const url = URL.createObjectURL(new Blob([buffer]));
    const img = new Image();
    img.onload = () => {
      loadedImages[partId] = img;
      settings.parts[partId].type = '2d';
      statusEl.textContent = `Imagine 2D încărcată pentru ${partId}`;
    };
    img.src = url;
  }
}

function buildUI() {
  const container = document.getElementById("partCards");
  container.innerHTML = "";
  PARTS.forEach(p => {
    const st = settings.parts[p.id];
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h3>${p.label}</h3>
      <div class="row">
        <input type="file" accept=".glb,.gltf,image/*" data-id="${p.id}" class="file-input" />
      </div>
      <div class="row">
        <label>Scală</label>
        <input type="range" min="0.2" max="3" step="0.05" value="${st.scale}" data-k="scale" data-id="${p.id}" />
      </div>
    `;
    container.appendChild(card);
  });

  container.addEventListener("input", (e) => {
    const id = e.target.dataset.id;
    const key = e.target.dataset.k;
    if (id && key) settings.parts[id][key] = parseFloat(e.target.value);
  });

  container.addEventListener("change", (e) => {
    const id = e.target.dataset.id;
    if (id && e.target.files[0]) loadPartFile(id, e.target.files[0]);
  });
}

// MediaPipe & Camera Init
async function init() {
  const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/wasm");
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task", delegate: "GPU" },
    runningMode: "VIDEO", numPoses: 1
  });
  statusEl.textContent = "Sistem Pregătit. Pornește Camera.";
}

document.getElementById("btnCam").addEventListener("click", async () => {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
  video.srcObject = stream;
  await video.play();
  cameraOn = true;
  statusEl.textContent = "Urmărire AI Activă.";
});

function renderLoop() {
  requestAnimationFrame(renderLoop);
  if (cameraOn && video.readyState >= 2) {
    const res = poseLandmarker.detectForVideo(video, performance.now());
    latestWorld = res.worldLandmarks ? res.worldLandmarks[0] : null;
    latestLm = res.landmarks ? res.landmarks[0] : null;
  }

  octx.clearRect(0, 0, overlay.width, overlay.height);

  if (latestWorld && settings.show3D) {
    // Pozitionare Modele 3D (GLB)
    PARTS.forEach(p => {
      const model = loadedModels[p.id];
      if (model && settings.parts[p.id].type === '3d') {
        const lm = latestWorld[p.lmIndex];
        model.position.set(-lm.x * 2, -lm.y * 2, -lm.z * 2);
        const s = settings.parts[p.id].scale;
        model.scale.set(s, s, s);
      }
    });
    renderer.render(scene, camera);
  }

  // Render Skeleton 2D
  if (latestLm && settings.showSkel) {
    octx.fillStyle = "#3ddc97";
    latestLm.forEach(lm => {
      const x = (settings.mirror ? 1 - lm.x : lm.x) * overlay.width;
      const y = lm.y * overlay.height;
      octx.beginPath();
      octx.arc(x, y, 4, 0, Math.PI * 2);
      octx.fill();
    });
  }
}

document.getElementById("btnSave").addEventListener("click", () => {
  localStorage.setItem("webar-settings-v3", JSON.stringify(settings));
  statusEl.textContent = "Setări salvate cu succes!";
});

document.getElementById("btnReset").addEventListener("click", () => {
  localStorage.removeItem("webar-settings-v3");
  location.reload();
});

buildUI();
init().then(() => renderLoop());
</script>
</body>
</html>
