<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Studio Mapper - 8 Puncte & Full Pose Tracking</title>

  <!-- MediaPipe CDNs (FaceMesh, Pose, Segmentation & Camera Utils) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    body, html {
      width: 100vw; height: 100vh; overflow: hidden;
      background-color: #050508; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #app-container { width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; width: 100vw; height: 100vh; background: #000; cursor: crosshair; }
    #webcam, #vid { display: none; }

    #top-bar {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: rgba(10, 10, 20, 0.88); padding: 10px 14px;
      border-radius: 10px; border: 1px solid rgba(0, 255, 204, 0.4);
      backdrop-filter: blur(10px); display: flex; align-items: center; gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5); flex-wrap: wrap; max-width: 95vw;
    }

    #top-bar label { font-size: 11px; font-weight: bold; color: #00ffcc; text-transform: uppercase; }
    .file-input { color: #ddd; font-size: 11px; cursor: pointer; max-width: 160px; }

    .btn-action {
      background: rgba(255, 255, 255, 0.1); color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2); padding: 5px 9px;
      font-size: 11px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s;
    }
    .btn-action:hover { background: rgba(0, 255, 204, 0.2); border-color: #00ffcc; color: #00ffcc; }
    .btn-active { background: #00ffcc !important; color: #000 !important; }
    .btn-reset { border-color: #ff3366; color: #ff3366; }
    .btn-reset:hover { background: rgba(255, 51, 102, 0.2); }

    #status {
      position: absolute; top: 15px; right: 15px; z-index: 10;
      background: rgba(10, 10, 20, 0.85); padding: 6px 12px; border-radius: 6px;
      font-size: 11px; color: #00ffcc; border: 1px solid rgba(0,255,204,0.3); backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

<div id="app-container">
  <div id="top-bar">
    <label>MAPPING MEDIA:</label>
    <input type="file" id="mediaInput" accept="video/*,image/*" class="file-input">
    
    <button id="toggle-grid" class="btn-action btn-active">Grilă: ON</button>
    <button id="toggle-cam" class="btn-action btn-active">Cameră: ON</button>
    <button id="toggle-pose" class="btn-action btn-active">Brațe & Torso: ON</button>
    <button id="toggle-ai-cut" class="btn-action">AI Cut Corp: OFF</button>
    <button id="reset-btn" class="btn-action btn-reset">Resetare Grilă</button>
  </div>

  <div id="status">Pornire module AI Tracking...</div>
  <canvas id="canvas"></canvas>
</div>

<video id="webcam" playsinline muted></video>
<video id="vid" loop muted playsinline crossorigin="anonymous"></video>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const videoElem = document.getElementById('vid');
  const webcamElem = document.getElementById('webcam');
  const imageElem = new Image();
  const mediaInput = document.getElementById('mediaInput');
  const resetBtn = document.getElementById('reset-btn');
  const toggleGridBtn = document.getElementById('toggle-grid');
  const toggleCamBtn = document.getElementById('toggle-cam');
  const togglePoseBtn = document.getElementById('toggle-pose');
  const toggleAiCutBtn = document.getElementById('toggle-ai-cut');
  const statusEl = document.getElementById('status');

  let showGrid = true;
  let showCamera = true;
  let showPose = true;
  let isAiCutOn = false;
  let currentMedia = null;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  /*
      STRUCTURA CELOR 8 PUNCTE DE PE MARGINI:
      p0 -------- p1 -------- p2
       |                       |
      p3          C            p4
       |                       |
      p5 -------- p6 -------- p7
  */
  function getDefaultPoints() {
    const w = canvas.width;
    const h = canvas.height;
    return [
      { x: w * 0.30, y: h * 0.20 }, // p0
      { x: w * 0.50, y: h * 0.20 }, // p1
      { x: w * 0.70, y: h * 0.20 }, // p2
      { x: w * 0.30, y: h * 0.50 }, // p3
      { x: w * 0.70, y: h * 0.50 }, // p4
      { x: w * 0.30, y: h * 0.80 }, // p5
      { x: w * 0.50, y: h * 0.80 }, // p6
      { x: w * 0.70, y: h * 0.80 }  // p7
    ];
  }

  let pts = JSON.parse(localStorage.getItem('v40_mapper_8pts_config')) || getDefaultPoints();

  function saveConfig() {
    localStorage.setItem('v40_mapper_8pts_config', JSON.stringify(pts));
  }

  resetBtn.addEventListener('click', () => {
    pts = getDefaultPoints();
    saveConfig();
  });

  toggleGridBtn.addEventListener('click', () => {
    showGrid = !showGrid;
    toggleGridBtn.innerText = `Grilă: ${showGrid ? 'ON' : 'OFF'}`;
    toggleGridBtn.classList.toggle('btn-active', showGrid);
  });

  toggleCamBtn.addEventListener('click', () => {
    showCamera = !showCamera;
    toggleCamBtn.innerText = `Cameră: ${showCamera ? 'ON' : 'OFF'}`;
    toggleCamBtn.classList.toggle('btn-active', showCamera);
  });

  togglePoseBtn.addEventListener('click', () => {
    showPose = !showPose;
    togglePoseBtn.innerText = `Brațe & Torso: ${showPose ? 'ON' : 'OFF'}`;
    togglePoseBtn.classList.toggle('btn-active', showPose);
  });

  toggleAiCutBtn.addEventListener('click', () => {
    isAiCutOn = !isAiCutOn;
    toggleAiCutBtn.innerText = `AI Cut Corp: ${isAiCutOn ? 'ON' : 'OFF'}`;
    toggleAiCutBtn.classList.toggle('btn-active', isAiCutOn);
  });

  // Încărcare Media (Video sau Imagine)
  mediaInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);

    if (file.type.startsWith('video/')) {
      videoElem.src = url;
      videoElem.loop = true;
      videoElem.muted = true;
      videoElem.playsInline = true;

      videoElem.onloadeddata = () => {
        currentMedia = videoElem;
        videoElem.play().catch(err => console.log('Autoplay blocked:', err));
      };
    } else if (file.type.startsWith('image/')) {
      imageElem.onload = () => {
        currentMedia = imageElem;
      };
      imageElem.src = url;
    }
  });

  // Logica de Drag & Drop (Puncte individuale și Cadru Întreg)
  let dragPtIndex = -1;
  let isDraggingWholeFrame = false;
  let lastMouse = { x: 0, y: 0 };

  function isPointInsidePolygon(p, vs) {
    let x = p.x, y = p.y, inside = false;
    for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
      let xi = vs[i].x, yi = vs[i].y, xj = vs[j].x, yj = vs[j].y;
      let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function handleStart(e) {
    const mouse = getMousePos(e);
    dragPtIndex = -1;
    isDraggingWholeFrame = false;

    if (showGrid) {
      for (let i = 0; i < pts.length; i++) {
        if (Math.hypot(pts[i].x - mouse.x, pts[i].y - mouse.y) < 25) {
          dragPtIndex = i;
          break;
        }
      }
    }

    const outerPoly = [pts[0], pts[1], pts[2], pts[4], pts[7], pts[6], pts[5], pts[3]];
    if (dragPtIndex === -1 && isPointInsidePolygon(mouse, outerPoly)) {
      isDraggingWholeFrame = true;
    }

    lastMouse = mouse;
  }

  function handleMove(e) {
    if (dragPtIndex === -1 && !isDraggingWholeFrame) return;

    const mouse = getMousePos(e);
    const dx = mouse.x - lastMouse.x;
    const dy = mouse.y - lastMouse.y;

    if (dragPtIndex !== -1) {
      pts[dragPtIndex].x = mouse.x;
      pts[dragPtIndex].y = mouse.y;
    } else if (isDraggingWholeFrame) {
      pts.forEach(p => { p.x += dx; p.y += dy; });
    }

    lastMouse = mouse;
    saveConfig();
  }

  function handleEnd() {
    dragPtIndex = -1;
    isDraggingWholeFrame = false;
  }

  canvas.addEventListener('mousedown', handleStart);
  window.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleEnd);

  canvas.addEventListener('touchstart', handleStart);
  window.addEventListener('touchmove', handleMove);
  window.addEventListener('touchend', handleEnd);

  // Funcția de deformare a texturei pe un triunghi (UV Mapping)
  function drawTriangleUV(media, p0, p1, p2, u0, v0, u1, v1, u2, v2) {
    const w = media.videoWidth || media.width || 1;
    const h = media.videoHeight || media.height || 1;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.closePath();
    ctx.clip();

    const x0 = p0.x, y0 = p0.y, x1 = p1.x, y1 = p1.y, x2 = p2.x, y2 = p2.y;
    const sx0 = u0 * w, sy0 = v0 * h, sx1 = u1 * w, sy1 = v1 * h, sx2 = u2 * w, sy2 = v2 * h;

    const denom = (sx0 * (sy1 - sy2) + sx1 * (sy2 - sy0) + sx2 * (sy0 - sy1));
    if (Math.abs(denom) < 1e-5) { ctx.restore(); return; }

    const a = (x0 * (sy1 - sy2) + x1 * (sy2 - sy0) + x2 * (sy0 - sy1)) / denom;
    const c = (x0 * (sx2 - sx1) + x1 * (sx0 - sx2) + x2 * (sx1 - sx0)) / denom;
    const e = (x0 * (sx1 * sy2 - sx2 * sy1) + x1 * (sx2 * sy0 - sx0 * sy2) + x2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    const b = (y0 * (sy1 - sy2) + y1 * (sy2 - sy0) + y2 * (sy0 - sy1)) / denom;
    const d = (y0 * (sx2 - sx1) + y1 * (sx0 - sx2) + y2 * (sx1 - sx0)) / denom;
    const f = (y0 * (sx1 * sy2 - sx2 * sy1) + y1 * (sx2 * sy0 - sx0 * sy2) + y2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    ctx.transform(a, b, c, d, e, f);
    ctx.drawImage(media, 0, 0, w, h);
    ctx.restore();
  }

  // Maparea completă a fișierului media pe cele 8 puncte
  function renderSingleVideo8Points(media) {
    const [p0, p1, p2, p3, p4, p5, p6, p7] = pts;

    const center = {
      x: ((p1.x + p6.x) / 2 + (p3.x + p4.x) / 2) / 2,
      y: ((p1.y + p6.y) / 2 + (p3.y + p4.y) / 2) / 2
    };

    // 1. SUS-STÂNGA
    drawTriangleUV(media, p0, p1, center, 0, 0, 0.5, 0, 0.5, 0.5);
    drawTriangleUV(media, p0, center, p3, 0, 0, 0.5, 0.5, 0, 0.5);

    // 2. SUS-DREAPTA
    drawTriangleUV(media, p1, p2, center, 0.5, 0, 1, 0, 0.5, 0.5);
    drawTriangleUV(media, p2, p4, center, 1, 0, 1, 0.5, 0.5, 0.5);

    // 3. JOS-DREAPTA
    drawTriangleUV(media, center, p4, p7, 0.5, 0.5, 1, 0.5, 1, 1);
    drawTriangleUV(media, center, p7, p6, 0.5, 0.5, 1, 1, 0.5, 1);

    // 4. JOS-STÂNGA
    drawTriangleUV(media, p3, center, p5, 0, 0.5, 0.5, 0, 1);
    drawTriangleUV(media, center, p6, p5, 0.5, 0.5, 0.5, 1, 0, 1);
  }

  // --- MEDIAPIPE TRACKING (POSE, FACE MESH & SEGMENTATION) ---
  let latestPoseResults = null;
  let latestSegmentationResults = null;

  const pose = new Pose({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
  pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
  pose.onResults((r) => { latestPoseResults = r; });

  const selfieSegmentation = new SelfieSegmentation({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}` });
  selfieSegmentation.setOptions({ modelSelection: 1 });
  selfieSegmentation.onResults((r) => { latestSegmentationResults = r; });

  // Desenează conexiunile brațelor și torso-ului peste canvas
  function drawPoseSkeleton(landmarks) {
    const w = canvas.width;
    const h = canvas.height;

    // Conexiunile cheie pentru brațe și torso (Landmarks Pose)
    const connections = [
      [11, 12], // Umeri (Torso Sus)
      [11, 23], [12, 24], // Torso Lateral
      [23, 24], // Șolduri (Torso Jos)
      [11, 13], [13, 15], // Braț Stânga
      [12, 14], [14, 16]  // Braț Dreapta
    ];

    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';

    connections.forEach(([i, j]) => {
      const p1 = landmarks[i];
      const p2 = landmarks[j];
      if (p1 && p2 && p1.visibility > 0.4 && p2.visibility > 0.4) {
        ctx.beginPath();
        ctx.moveTo(p1.x * w, p1.y * h);
        ctx.lineTo(p2.x * w, p2.y * h);
        ctx.stroke();
      }
    });

    // Puncte de articulație (Umeri, Coate, Încheieturi, Șolduri)
    const keyJoints = [11, 12, 13, 14, 15, 16, 23, 24];
    keyJoints.forEach((idx) => {
      const p = landmarks[idx];
      if (p && p.visibility > 0.4) {
        ctx.fillStyle = '#ff0055';
        ctx.beginPath();
        ctx.arc(p.x * w, p.y * h, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    });
  }

  // BUCLA PRINCIPALĂ DE RANDARE (RENDER LOOP)
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. RANDARE MAPPING 3D (Fișier Video/Foto Încărcat)
    if (currentMedia) {
      if (
        currentMedia === imageElem ||
        (currentMedia === videoElem && videoElem.readyState >= 2)
      ) {
        renderSingleVideo8Points(currentMedia);
      }
    }

    // 2. RANDARE GRILĂ DE CONTROL 8 PUNCTE
    if (showGrid) {
      const [p0, p1, p2, p3, p4, p5, p6, p7] = pts;

      ctx.strokeStyle = 'rgba(0, 255, 204, 0.5)';
      ctx.lineWidth = 1.5;

      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p4.x, p4.y); ctx.lineTo(p7.x, p7.y); ctx.lineTo(p6.x, p6.y);
      ctx.lineTo(p5.x, p5.y); ctx.lineTo(p3.x, p3.y); ctx.closePath();

      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p6.x, p6.y);
      ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
      ctx.moveTo(p0.x, p0.y); ctx.lineTo(p7.x, p7.y);
      ctx.moveTo(p2.x, p2.y); ctx.lineTo(p5.x, p5.y);
      ctx.stroke();

      pts.forEach((p, idx) => {
        ctx.fillStyle = (idx === 1 || idx === 6 || idx === 3 || idx === 4) ? '#ff0055' : '#00ffcc';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });
    }

    // 3. RANDARE CAMERĂ REALĂ / AI SEGMENTATION
    if (showCamera && webcamElem.readyState >= 2) {
      if (isAiCutOn && latestSegmentationResults) {
        ctx.save();
        ctx.drawImage(latestSegmentationResults.segmentationMask, 0, 0, canvas.width, canvas.height);
        ctx.globalCompositeOperation = 'source-in';
        ctx.drawImage(webcamElem, 0, 0, canvas.width, canvas.height);
        ctx.restore();
      } else {
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.drawImage(webcamElem, 0, 0, canvas.width, canvas.height);
        ctx.restore();
      }
    }

    // 4. RANDARE SCHELET BRAȚE ȘI TORSO (POSE TRACKING)
    if (showPose && latestPoseResults && latestPoseResults.poseLandmarks) {
      drawPoseSkeleton(latestPoseResults.poseLandmarks);
      statusEl.innerText = "Tracking Activ (Brațe/Torso/Cap)";
    } else if (showCamera) {
      statusEl.innerText = "Căutare persoană în cameră...";
    } else {
      statusEl.innerText = "Cameră Inactivă";
    }

    requestAnimationFrame(render);
  }

  // INIȚIALIZARE WEBCAM & DETECȚIE CONTINUĂ
  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 1280, height: 720 },
        audio: false
      });
      webcamElem.srcObject = stream;
      await webcamElem.play();

      const camera = new window.Camera(webcamElem, {
        onFrame: async () => {
          if (showCamera || showPose) {
            if (isAiCutOn) await selfieSegmentation.send({ image: webcamElem });
            if (showPose) await pose.send({ image: webcamElem });
          }
        },
        width: 640,
        height: 480
      });
      camera.start();
      render();

    } catch (err) {
      statusEl.innerText = "Eroare acces cameră!";
      console.error(err);
      render(); // Permite rularea mapping-ului chiar dacă nu există cameră
    }
  }

  window.addEventListener('DOMContentLoaded', initCamera);
</script>
</body>
</html>
