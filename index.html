<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Versiunea 1.4: Fix PNG & Full GLB/GLTF Three.js Renderer Integration -->
  <title>Tracking & Multi-Layer System - v1.4</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #08080c;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam, #output_canvas, #three_canvas, #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
    #webcam, #bg-video {
      display: none;
    }
    #output_canvas {
      z-index: 2;
      transform: scaleX(-1);
    }
    #three_canvas {
      z-index: 3; /* Scena 3D se afișează peste canvas-ul 2D */
      pointer-events: none;
      transform: scaleX(-1);
    }

    /* Control Panel */
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 320px;
      max-height: 92vh;
      overflow-y: auto;
      background: rgba(15, 15, 25, 0.92);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .btn-main {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      border: none;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-main:hover {
      transform: scale(1.02);
    }

    .btn-secondary {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 10px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .upload-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }
    .upload-group label {
      color: #00ffcc;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .file-input {
      color: #ccc;
      font-size: 12px;
    }

    .scale-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 12px;
    }
    .scale-controls input[type="range"] {
      flex: 1;
    }

    #status {
      color: #00ffcc;
      font-size: 12px;
      font-weight: bold;
    }
    #version-tag {
      position: absolute;
      bottom: 15px;
      right: 15px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      z-index: 10;
    }
  </style>

  <!-- CDNs MediaPipe & Three.js cu GLTFLoader -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="container">
  <div id="ui-overlay">
    <button id="start-btn" class="btn-main">▶️ Pornire Sistem v1.4</button>
    <div id="status">Apasă pe buton pentru inițializare...</div>

    <div style="display: flex; gap: 6px;">
      <button id="toggle-crop-btn" class="btn-secondary">✂️ Crop AI: ON</button>
      <button id="fullscreen-btn" class="btn-secondary">⛶ Fullscreen</button>
    </div>

    <!-- Grupa 1: Upload Fundal Foto sau Video -->
    <div class="upload-group">
      <label>1. Fundal Custom (Foto sau Video)</label>
      <input type="file" id="bg-file-upload" accept="image/*,video/*" class="file-input">
    </div>

    <!-- Grupa 2: Upload Overlap PNG -->
    <div class="upload-group">
      <label>2. Upload PNG Overlap</label>
      <input type="file" id="png-upload" accept="image/png,image/*" class="file-input">
      <div class="scale-controls">
        <span>Scală PNG:</span>
        <input type="range" id="png-scale" min="0.2" max="4.0" step="0.1" value="1.0">
      </div>
    </div>

    <!-- Grupa 3: Upload Model 3D (.GLB / .GLTF) -->
    <div class="upload-group">
      <label>3. Upload Model 3D (.GLB / .GLTF)</label>
      <input type="file" id="glb-upload" accept=".glb,.gltf" class="file-input">
      <div class="scale-controls">
        <span>Scală Model 3D:</span>
        <input type="range" id="glb-scale" min="0.1" max="10.0" step="0.1" value="1.0">
      </div>
    </div>
  </div>

  <div id="version-tag">Versiunea 1.4</div>

  <video id="webcam" autoplay playsinline muted></video>
  <video id="bg-video" autoplay loop muted playsinline></video>
  <canvas id="output_canvas"></canvas>
  <canvas id="three_canvas"></canvas>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const bgVideoElement = document.getElementById('bg-video');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const threeCanvas = document.getElementById('three_canvas');

  const startBtn = document.getElementById('start-btn');
  const toggleCropBtn = document.getElementById('toggle-crop-btn');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const statusDiv = document.getElementById('status');
  const container = document.getElementById('container');

  const bgFileUpload = document.getElementById('bg-file-upload');
  const pngUpload = document.getElementById('png-upload');
  const glbUpload = document.getElementById('glb-upload');
  const pngScaleInput = document.getElementById('png-scale');
  const glbScaleInput = document.getElementById('glb-scale');

  let camera = null;
  let enableCrop = true;
  let bgType = 'none';
  let customBgImg = null;
  let customPngImg = null;

  let pngScaleFactor = 1.0;
  let glbScaleFactor = 1.0;

  // Masking Canvas
  const maskCanvas = document.createElement('canvas');
  const maskCtx = maskCanvas.getContext('2d');

  // --- CONFIGURARE THREE.JS SCENE (PENTRU MODELE GLB/GLTF) ---
  const scene = new THREE.Scene();
  const camera3D = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera3D.position.set(0, 0, 5);

  const renderer3D = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
  renderer3D.setSize(window.innerWidth, window.innerHeight);

  const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(0, 5, 5);
  scene.add(dirLight);

  let loaded3DModel = null;
  const gltfLoader = new THREE.GLTFLoader();

  function resizeCanvas() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvasElement.width = w;
    canvasElement.height = h;
    maskCanvas.width = w;
    maskCanvas.height = h;

    camera3D.aspect = w / h;
    camera3D.updateProjectionMatrix();
    renderer3D.setSize(w, h);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // 1. ÎNCĂRCARE FUNDAL
  bgFileUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.type.startsWith('image/')) {
      bgType = 'image';
      bgVideoElement.pause();
      const img = new Image();
      img.onload = () => { customBgImg = img; };
      img.src = URL.createObjectURL(file);
      statusDiv.innerText = "Fundal FOTO încărcat!";
    } else if (file.type.startsWith('video/')) {
      bgType = 'video';
      bgVideoElement.src = URL.createObjectURL(file);
      bgVideoElement.play();
      statusDiv.innerText = "Fundal VIDEO încărcat!";
    }
  });

  // 2. ÎNCĂRCARE FOTO PNG OVERLAP
  pngUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const img = new Image();
      img.onload = () => {
        customPngImg = img;
        statusDiv.innerText = "Imagine PNG încărcată cu succes!";
      };
      img.src = URL.createObjectURL(file);
    }
  });

  // 3. ÎNCĂRCARE MODEL 3D (GLB / GLTF)
  glbUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const url = URL.createObjectURL(file);
      statusDiv.innerText = "Se încarcă modelul 3D (.GLB)...";
      
      gltfLoader.load(url, (gltf) => {
        if (loaded3DModel) scene.remove(loaded3DModel);
        loaded3DModel = gltf.scene;
        scene.add(loaded3DModel);
        statusDiv.innerText = "Model 3D (.GLB) încărcat și activat pe ecran!";
      }, undefined, (error) => {
        console.error(error);
        statusDiv.innerText = "Eroare la încărcarea fișierului 3D.";
      });
    }
  });

  pngScaleInput.addEventListener('input', (e) => { pngScaleFactor = parseFloat(e.target.value); });
  glbScaleInput.addEventListener('input', (e) => { 
    glbScaleFactor = parseFloat(e.target.value);
    if (loaded3DModel) {
      loaded3DModel.scale.set(glbScaleFactor, glbScaleFactor, glbScaleFactor);
    }
  });

  toggleCropBtn.addEventListener('click', () => {
    enableCrop = !enableCrop;
    toggleCropBtn.innerText = `✂️ Crop AI: ${enableCrop ? 'ON' : 'OFF'}`;
  });

  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) container.requestFullscreen();
    else document.exitFullscreen();
  });

  // MediaPipe Setup
  const holistic = new Holistic({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
  });

  holistic.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: true,
    smoothSegmentation: true,
    refineFaceLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  holistic.onResults((results) => {
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);

    // AI CROP & BACKGROUND RENDER
    if (enableCrop && results.segmentationMask) {
      maskCtx.save();
      maskCtx.clearRect(0, 0, w, h);
      maskCtx.drawImage(results.segmentationMask, 0, 0, w, h);
      maskCtx.globalCompositeOperation = 'source-in';
      maskCtx.drawImage(results.image, 0, 0, w, h);
      maskCtx.restore();

      if (bgType === 'image' && customBgImg) {
        canvasCtx.drawImage(customBgImg, 0, 0, w, h);
      } else if (bgType === 'video' && bgVideoElement.readyState >= 2) {
        canvasCtx.drawImage(bgVideoElement, 0, 0, w, h);
      } else {
        canvasCtx.fillStyle = '#0a0a10';
        canvasCtx.fillRect(0, 0, w, h);
      }

      canvasCtx.drawImage(maskCanvas, 0, 0, w, h);
    } else {
      canvasCtx.drawImage(results.image, 0, 0, w, h);
    }

    // MAPARE CORP & POZIȚIONARE RESURSE
    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const pts = {
        nose:          { x: lm[0].x * w,  y: lm[0].y * h },
        leftShoulder:  { x: lm[11].x * w, y: lm[11].y * h },
        rightShoulder: { x: lm[12].x * w, y: lm[12].y * h },
        leftWrist:     { x: lm[15].x * w, y: lm[15].y * h },
        rightWrist:    { x: lm[16].x * w, y: lm[16].y * h },
        leftHip:       { x: lm[23].x * w, y: lm[23].y * h },
        rightHip:      { x: lm[24].x * w, y: lm[24].y * h }
      };

      // 1. DESENARE SHAPE BUST
      canvasCtx.beginPath();
      canvasCtx.moveTo(pts.leftShoulder.x, pts.leftShoulder.y);
      canvasCtx.lineTo(pts.rightShoulder.x, pts.rightShoulder.y);
      canvasCtx.lineTo(pts.rightHip.x, pts.rightHip.y);
      canvasCtx.lineTo(pts.leftHip.x, pts.leftHip.y);
      canvasCtx.closePath();
      canvasCtx.fillStyle = 'rgba(0, 255, 204, 0.2)';
      canvasCtx.fill();
      canvasCtx.strokeStyle = '#00ffcc';
      canvasCtx.lineWidth = 2;
      canvasCtx.stroke();

      // 2. AFISARE OVERLAP PNG PESTE MÂNĂ/CORP
      if (customPngImg) {
        const pngW = 200 * pngScaleFactor;
        const pngH = (customPngImg.height / customPngImg.width) * pngW;
        // Poziționare pe încheietura dreaptă
        canvasCtx.drawImage(customPngImg, pts.rightWrist.x - pngW / 2, pts.rightWrist.y - pngH / 2, pngW, pngH);
      }

      // 3. ANCORARE ȘI POZIȚIONARE MODEL 3D (.GLB) PE NAS/FAȚĂ
      if (loaded3DModel) {
        // Conversie coordonate Pixel -> World Space Three.js
        const normX = (lm[0].x - 0.5) * -4;
        const normY = -(lm[0].y - 0.5) * 3;
        
        loaded3DModel.position.set(normX, normY, 0);
      }
    }

    // MAPARE MÂINI
    if (results.leftHandLandmarks) drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 2 });
    if (results.rightHandLandmarks) drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 2 });

    canvasCtx.restore();

    // Render Scena 3D Three.js
    renderer3D.render(scene, camera3D);
  });

  // Start Camera
  startBtn.addEventListener('click', async () => {
    startBtn.style.display = 'none';
    if (!camera) {
      camera = new Camera(videoElement, {
        onFrame: async () => { await holistic.send({ image: videoElement }); },
        width: 1280,
        height: 720
      });
      await camera.start();
      statusDiv.innerText = "v1.4 Activ • PNG & Model 3D pregătite!";
    }
  });
</script>

</body>
</html>
