<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking & Multi-Layer System - v1.5 Fixed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #08080c;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam, #output_canvas, #three_canvas, #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
    #webcam, #bg-video {
      display: none;
    }
    #output_canvas {
      z-index: 2;
      transform: scaleX(-1);
    }
    #three_canvas {
      z-index: 3;
      pointer-events: none;
    }

    /* Panou Control Upper-Left */
    #ui-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 330px;
      max-height: 92vh;
      overflow-y: auto;
      background: rgba(15, 15, 25, 0.92);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .btn-main {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      border: none;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-main:hover {
      transform: scale(1.02);
    }

    .btn-secondary {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 10px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: rgba(0, 255, 204, 0.2);
    }

    .upload-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }
    .upload-group label {
      color: #00ffcc;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .file-input {
      color: #ccc;
      font-size: 12px;
    }

    .scale-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 12px;
    }
    .scale-controls input[type="range"], .scale-controls select {
      flex: 1;
      background: #1a1a2e;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 3px;
      border-radius: 4px;
    }

    #status {
      color: #00ffcc;
      font-size: 12px;
      font-weight: bold;
    }
    #version-tag {
      position: absolute;
      bottom: 15px;
      right: 15px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      z-index: 10;
    }
  </style>

  <!-- Libs MediaPipe & Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="container">
  <div id="ui-overlay">
    <button id="start-btn" class="btn-main">▶️ Pornire Sistem v1.5</button>
    <div id="status">Apasă pe buton pentru inițializare...</div>

    <div style="display: flex; gap: 6px;">
      <button id="toggle-crop-btn" class="btn-secondary">✂️ Crop AI: ON</button>
      <button id="fullscreen-btn" class="btn-secondary">⛶ Fullscreen</button>
    </div>

    <!-- 1. Fundal -->
    <div class="upload-group">
      <label>1. Fundal Custom (Foto sau Video)</label>
      <input type="file" id="bg-file-upload" accept="image/*,video/*" class="file-input">
    </div>

    <!-- 2. PNG Overlap -->
    <div class="upload-group">
      <label>2. Upload Overlap PNG</label>
      <input type="file" id="png-upload" accept="image/png,image/*" class="file-input">
      <div class="scale-controls">
        <span>Ancoră PNG:</span>
        <select id="png-anchor">
          <option value="rightWrist">Mână Dreaptă</option>
          <option value="leftWrist">Mână Stângă</option>
          <option value="nose">Față / Cap</option>
          <option value="chest">Centru Bust</option>
        </select>
      </div>
      <div class="scale-controls">
        <span>Scală PNG:</span>
        <input type="range" id="png-scale" min="0.2" max="4.0" step="0.1" value="1.0">
      </div>
    </div>

    <!-- 3. Model 3D (GLB/GLTF) -->
    <div class="upload-group">
      <label>3. Upload Model 3D (.GLB / .GLTF)</label>
      <input type="file" id="glb-upload" accept=".glb,.gltf" class="file-input">
      <div class="scale-controls">
        <span>Scală Model 3D:</span>
        <input type="range" id="glb-scale" min="0.1" max="5.0" step="0.1" value="1.0">
      </div>
      <div class="scale-controls">
        <span>Scală Cerc Cap:</span>
        <input type="range" id="head-scale" min="0.5" max="3.0" step="0.1" value="1.0">
      </div>
    </div>
  </div>

  <div id="version-tag">Versiunea 1.5</div>

  <video id="webcam" autoplay playsinline muted></video>
  <video id="bg-video" autoplay loop muted playsinline></video>
  <canvas id="output_canvas"></canvas>
  <canvas id="three_canvas"></canvas>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const bgVideoElement = document.getElementById('bg-video');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const threeCanvas = document.getElementById('three_canvas');

  const startBtn = document.getElementById('start-btn');
  const toggleCropBtn = document.getElementById('toggle-crop-btn');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const statusDiv = document.getElementById('status');
  const container = document.getElementById('container');

  const bgFileUpload = document.getElementById('bg-file-upload');
  const pngUpload = document.getElementById('png-upload');
  const glbUpload = document.getElementById('glb-upload');
  const pngScaleInput = document.getElementById('png-scale');
  const headScaleInput = document.getElementById('head-scale');
  const glbScaleInput = document.getElementById('glb-scale');
  const pngAnchorSelect = document.getElementById('png-anchor');

  let camera = null;
  let enableCrop = localStorage.getItem('app_crop') !== 'false';
  let bgType = 'none';
  let customBgImg = null;
  let customPngImg = null;

  let pngScaleFactor = parseFloat(localStorage.getItem('app_pngScale')) || 1.0;
  let headScaleFactor = parseFloat(localStorage.getItem('app_headScale')) || 1.0;
  let glbScaleFactor = parseFloat(localStorage.getItem('app_glbScale')) || 1.0;
  let pngAnchor = 'rightWrist';

  pngScaleInput.value = pngScaleFactor;
  headScaleInput.value = headScaleFactor;
  glbScaleInput.value = glbScaleFactor;

  const maskCanvas = document.createElement('canvas');
  const maskCtx = maskCanvas.getContext('2d');

  // --- THREE.JS SCENA 3D ---
  const scene = new THREE.Scene();
  const camera3D = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera3D.position.set(0, 0, 5);

  const renderer3D = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
  renderer3D.setSize(window.innerWidth, window.innerHeight);

  const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(0, 5, 5);
  scene.add(dirLight);

  let loaded3DModel = null;
  const gltfLoader = new THREE.GLTFLoader();

  function resizeCanvas() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvasElement.width = w;
    canvasElement.height = h;
    maskCanvas.width = w;
    maskCanvas.height = h;

    camera3D.aspect = w / h;
    camera3D.updateProjectionMatrix();
    renderer3D.setSize(w, h);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Încărcare Fundal
  bgFileUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.type.startsWith('image/')) {
      bgType = 'image';
      bgVideoElement.pause();
      const img = new Image();
      img.onload = () => { customBgImg = img; };
      img.src = URL.createObjectURL(file);
      statusDiv.innerText = "Fundal FOTO încărcat!";
    } else if (file.type.startsWith('video/')) {
      bgType = 'video';
      bgVideoElement.src = URL.createObjectURL(file);
      bgVideoElement.play();
      statusDiv.innerText = "Fundal VIDEO încărcat!";
    }
  });

  // Încărcare PNG
  pngUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const img = new Image();
      img.onload = () => {
        customPngImg = img;
        statusDiv.innerText = "PNG încărcat cu succes!";
      };
      img.src = URL.createObjectURL(file);
    }
  });

  // Încărcare Model 3D (.GLB)
  glbUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const url = URL.createObjectURL(file);
      statusDiv.innerText = "Se încarcă modelul 3D...";
      
      gltfLoader.load(url, (gltf) => {
        if (loaded3DModel) scene.remove(loaded3DModel);
        loaded3DModel = gltf.scene;
        loaded3DModel.scale.set(glbScaleFactor, glbScaleFactor, glbScaleFactor);
        scene.add(loaded3DModel);
        statusDiv.innerText = "Model 3D (.GLB) activat!";
      }, undefined, (error) => {
        statusDiv.innerText = "Eroare la fișierul 3D.";
      });
    }
  });

  // Event-uri Scalare & Salvare
  pngScaleInput.addEventListener('input', (e) => { 
    pngScaleFactor = parseFloat(e.target.value); 
    localStorage.setItem('app_pngScale', pngScaleFactor);
  });
  headScaleInput.addEventListener('input', (e) => { 
    headScaleFactor = parseFloat(e.target.value); 
    localStorage.setItem('app_headScale', headScaleFactor);
  });
  glbScaleInput.addEventListener('input', (e) => { 
    glbScaleFactor = parseFloat(e.target.value); 
    localStorage.setItem('app_glbScale', glbScaleFactor);
    if (loaded3DModel) loaded3DModel.scale.set(glbScaleFactor, glbScaleFactor, glbScaleFactor);
  });
  pngAnchorSelect.addEventListener('change', (e) => { pngAnchor = e.target.value; });

  toggleCropBtn.addEventListener('click', () => {
    enableCrop = !enableCrop;
    localStorage.setItem('app_crop', enableCrop);
    toggleCropBtn.innerText = `✂️ Crop AI: ${enableCrop ? 'ON' : 'OFF'}`;
  });

  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) container.requestFullscreen();
    else document.exitFullscreen();
  });

  // MediaPipe Setup
  const holistic = new Holistic({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
  });

  holistic.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: true,
    smoothSegmentation: true,
    refineFaceLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  holistic.onResults((results) => {
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);

    // 1. AI CROP & BACKGROUND
    if (enableCrop && results.segmentationMask) {
      maskCtx.save();
      maskCtx.clearRect(0, 0, w, h);
      maskCtx.drawImage(results.segmentationMask, 0, 0, w, h);
      maskCtx.globalCompositeOperation = 'source-in';
      maskCtx.drawImage(results.image, 0, 0, w, h);
      maskCtx.restore();

      if (bgType === 'image' && customBgImg) {
        canvasCtx.drawImage(customBgImg, 0, 0, w, h);
      } else if (bgType === 'video' && bgVideoElement.readyState >= 2) {
        canvasCtx.drawImage(bgVideoElement, 0, 0, w, h);
      } else {
        canvasCtx.fillStyle = '#0a0a10';
        canvasCtx.fillRect(0, 0, w, h);
      }

      canvasCtx.drawImage(maskCanvas, 0, 0, w, h);
    } else {
      canvasCtx.drawImage(results.image, 0, 0, w, h);
    }

    // 2. MAPARE CORP, LINII ȘI PUNCTE (Restaurate Complet)
    if (results.poseLandmarks) {
      const lm = results.poseLandmarks;

      const pts = {
        nose:          { x: lm[0].x * w,  y: lm[0].y * h },
        leftShoulder:  { x: lm[11].x * w, y: lm[11].y * h },
        rightShoulder: { x: lm[12].x * w, y: lm[12].y * h },
        leftElbow:     { x: lm[13].x * w, y: lm[13].y * h },
        rightElbow:    { x: lm[14].x * w, y: lm[14].y * h },
        leftWrist:     { x: lm[15].x * w, y: lm[15].y * h },
        rightWrist:    { x: lm[16].x * w, y: lm[16].y * h },
        leftHip:       { x: lm[23].x * w, y: lm[23].y * h },
        rightHip:      { x: lm[24].x * w, y: lm[24].y * h }
      };

      const shoulderWidth = Math.hypot(pts.rightShoulder.x - pts.leftShoulder.x, pts.rightShoulder.y - pts.leftShoulder.y);

      // Shape Bust
      canvasCtx.beginPath();
      canvasCtx.moveTo(pts.leftShoulder.x, pts.leftShoulder.y);
      canvasCtx.lineTo(pts.rightShoulder.x, pts.rightShoulder.y);
      canvasCtx.lineTo(pts.rightHip.x, pts.rightHip.y);
      canvasCtx.lineTo(pts.leftHip.x, pts.leftHip.y);
      canvasCtx.closePath();
      canvasCtx.fillStyle = 'rgba(0, 255, 204, 0.2)';
      canvasCtx.fill();
      canvasCtx.strokeStyle = '#00ffcc';
      canvasCtx.lineWidth = 3;
      canvasCtx.stroke();

      // Cercul pe Cap
      const headRadius = (shoulderWidth * 0.35) * headScaleFactor;
      canvasCtx.beginPath();
      canvasCtx.arc(pts.nose.x, pts.nose.y, headRadius, 0, 2 * Math.PI);
      canvasCtx.strokeStyle = '#00f2fe';
      canvasCtx.lineWidth = 3;
      canvasCtx.stroke();

      // Linii Brațe
      const arms = [
        [pts.leftShoulder, pts.leftElbow], [pts.leftElbow, pts.leftWrist],
        [pts.rightShoulder, pts.rightElbow], [pts.rightElbow, pts.rightWrist]
      ];
      canvasCtx.strokeStyle = '#ff0055';
      canvasCtx.lineWidth = 4;
      arms.forEach(([p1, p2]) => {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x, p1.y);
        canvasCtx.lineTo(p2.x, p2.y);
        canvasCtx.stroke();
      });

      // Puncte Articulații
      Object.values(pts).forEach((p) => {
        canvasCtx.beginPath();
        canvasCtx.arc(p.x, p.y, 7, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#ffff00';
        canvasCtx.fill();
        canvasCtx.stroke();
      });

      // 3. RANDARE PNG OVERLAP ANCORAT
      if (customPngImg) {
        let anchorPt = pts.rightWrist;
        if (pngAnchor === 'leftWrist') anchorPt = pts.leftWrist;
        if (pngAnchor === 'nose') anchorPt = pts.nose;
        if (pngAnchor === 'chest') anchorPt = { x: (pts.leftShoulder.x + pts.rightShoulder.x)/2, y: (pts.leftShoulder.y + pts.leftHip.y)/2 };

        const pngW = 180 * pngScaleFactor;
        const pngH = (customPngImg.height / customPngImg.width) * pngW;
        canvasCtx.drawImage(customPngImg, anchorPt.x - pngW / 2, anchorPt.y - pngH / 2, pngW, pngH);
      }

      // 4. ANCORARE ŞI CORECTARE MIŞCARE MODEL 3D (FIXTURE OGLINDĂ)
      if (loaded3DModel) {
        // Inversat direcția pe X pentru a potrivi cu mișcarea capului (fără efect invers de oglindă)
        const normX = (lm[0].x - 0.5) * 4;
        const normY = -(lm[0].y - 0.5) * 3;
        loaded3DModel.position.set(normX, normY, 0);
      }
    }

    // 5. MAPARE MÂINI (LEFT & RIGHT)
    if (results.leftHandLandmarks) drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 2 });
    if (results.rightHandLandmarks) drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 2 });

    canvasCtx.restore();

    // Render Scena 3D
    renderer3D.render(scene, camera3D);
  });

  // Pornire Aplicație
  startBtn.addEventListener('click', async () => {
    startBtn.style.display = 'none';
    if (!camera) {
      camera = new Camera(videoElement, {
        onFrame: async () => { await holistic.send({ image: videoElement }); },
        width: 1280,
        height: 720
      });
      await camera.start();
      statusDiv.innerText = "v1.5 Activ • Toate funcțiile funcționale!";
    }
  });
</script>

</body>
</html>
